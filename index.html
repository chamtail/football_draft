    }

    // ==================== 欧冠联赛 ====================
    function initUcl() {
      uclRoundPending = null;
      uclFinalPending = false;
      lastUclResults = null;

      // 判断用户是否有资格：上赛季前4、上赛季欧冠冠军（保送）或本身是争冠队
      const sorted_all = [...allTeams].sort((a, b) => b.strength - a.strength);
      const n = sorted_all.length;
      const contenders = sorted_all.slice(0, Math.ceil(n * 0.15));
      const european = sorted_all.slice(Math.ceil(n * 0.15), Math.ceil(n * 0.40));
      const contenderNames = new Set(contenders.map(t => t.name));

      let userQualified = contenderNames.has("我的球队"); // unlikely but check
      // 欧冠冠军保送：上赛季欧冠冠军即使联赛未进前4也拥有欧冠席位（相当于联赛多一个名额）
      if (!userQualified && uclSeasons.includes(seasonLabel(currentSeason - 1))) {
        userQualified = true;
      }
      if (!userQualified && seasonHistory.length > 0) {
        const prev = seasonHistory[seasonHistory.length - 1];
        const prevSorted = [...prev.standings].sort((a, b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf);
        for (let i = 0; i < Math.min(4, prevSorted.length); i++) {
          if (prevSorted[i].isUser) { userQualified = true; break; }
        }
      }
      const userParticipates = userQualified;
      // 第1赛季：用户未参赛也模拟欧冠（争冠队+欧战队参加，纯电脑比赛，用于奖项数据与冠军）
      if (!userParticipates && currentSeason >= 2) {
        ucl = { active: false };
        return;
      }

      // 收集参赛队
      const qualifiedNames = new Set();
      const qualifiedTeams = [];
      const draftedIds = new Set(draftPicks.filter(Boolean).map(p => p.id));

      const addTeam = (name, isUser) => {
        if (qualifiedNames.has(name)) return;
        qualifiedNames.add(name);
        // 先在 leagueTeams 中找（可能已是联赛对手）
        const inLeague = leagueTeams.find(t => t.name === name);
        if (inLeague) {
          qualifiedTeams.push({ name: inLeague.name, isUser: inLeague.isUser, strength: inLeague.strength, roster: inLeague.roster });
          return;
        }
        // 从 allTeams 构建
        const td = allTeams.find(t => t.name === name);
        if (td) {
          qualifiedTeams.push({
            name: td.name, isUser: false, strength: td.strength,
            roster: allPlayers.filter(p => p.team === td.name && !draftedIds.has(p.id))
          });
        }
      };

      // 1. 用户球队（若参赛）
      if (userParticipates) addTeam("我的球队", true);

      // 2. 上赛季前4
      if (seasonHistory.length > 0) {
        const prev = seasonHistory[seasonHistory.length - 1];
        const prevSorted = [...prev.standings].sort((a, b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf);
        for (let i = 0; i < Math.min(4, prevSorted.length); i++) {
          addTeam(prevSorted[i].name, prevSorted[i].isUser);
        }
      }

      // 3. 所有争冠队
      for (const t of contenders) addTeam(t.name, false);

      // 4. 从欧战队随机补满36
      const euroShuffled = [...european].filter(t => !qualifiedNames.has(t.name)).sort(() => Math.random() - 0.5);
      for (const t of euroShuffled) {
        if (qualifiedTeams.length >= 36) break;
        addTeam(t.name, false);
      }

      const teams36 = qualifiedTeams.slice(0, 36);
      if (teams36.length < 36) {
        ucl = { active: false };
        return;
      }

      // 按 strength 排序，分4档
      teams36.sort((a, b) => b.strength - a.strength);
      const pots = [[], [], [], []];
      for (let i = 0; i < 36; i++) pots[Math.floor(i / 9)].push(i);

      const fixtures = generateUclFixtures(teams36, pots);

      ucl = {
        active: true,
        userParticipates,
        teams: teams36,
        pots,
        leagueFixtures: fixtures,
        leagueStandings: teams36.map((t, i) => ({
          idx: i, name: t.name, isUser: t.isUser,
          played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0, points: 0
        })),
        leaguePhaseDone: false,
        knockout: {
          playoff: { ties: [], done: false },
          r16: { ties: [], done: false },
          qf: { ties: [], done: false },
          sf: { ties: [], done: false },
          final: { match: null, done: false }
        },
        champion: null
      };
    }

    function generateUclFixtures(teams, pots) {
      const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
      // 生成两回合对阵，确保同一对手不会重复
      const pairPotsBoth = (potA, potB) => {
        const sA = shuffle(potA), sB = shuffle(potB);
        // MD_A: potA主场，sA[i] vs sB[i]
        const mdA = sA.map((a, i) => ({ homeIdx: a, awayIdx: sB[i] }));
        // MD_B: potB主场，旋转sB一位避免重复对手
        const sBrot = [...sB.slice(1), sB[0]];
        const mdB = sA.map((a, i) => ({ homeIdx: sBrot[i], awayIdx: a }));
        return [mdA, mdB];
      };
      // 档内对抗：9队，每轮4场+1轮空，两轮共覆盖所有队
      const pairIntraBoth = (pot) => {
        const s = shuffle(pot);
        const mdA = [], mdB = [];
        // MD_A: s[0]-s[1], s[2]-s[3], s[4]-s[5], s[6]-s[7], s[8]轮空
        for (let i = 0; i < 8; i += 2) {
          mdA.push({ homeIdx: s[i], awayIdx: s[i + 1] });
        }
        // MD_B: s[1]-s[2], s[3]-s[4], s[5]-s[6], s[7]-s[8], s[0]轮空
        for (let i = 1; i < 9; i += 2) {
          mdB.push({ homeIdx: s[i], awayIdx: s[i + 1] });
        }
        return [mdA, mdB, s[8] /* byeA */, s[0] /* byeB */];
      };

      const fixtures = [];

      // MD1-2: Pot0↔Pot1, Pot2↔Pot3
      const [p01a, p01b] = pairPotsBoth(pots[0], pots[1]);
      const [p23a, p23b] = pairPotsBoth(pots[2], pots[3]);
      fixtures.push([...p01a, ...p23a]); // MD1: 18 matches
      fixtures.push([...p01b, ...p23b]); // MD2: 18 matches

      // MD3-4: Pot0↔Pot2, Pot1↔Pot3
      const [p02a, p02b] = pairPotsBoth(pots[0], pots[2]);
      const [p13a, p13b] = pairPotsBoth(pots[1], pots[3]);
      fixtures.push([...p02a, ...p13a]); // MD3
      fixtures.push([...p02b, ...p13b]); // MD4

      // MD5-6: Pot0↔Pot3, Pot1↔Pot2
      const [p03a, p03b] = pairPotsBoth(pots[0], pots[3]);
      const [p12a, p12b] = pairPotsBoth(pots[1], pots[2]);
      fixtures.push([...p03a, ...p12a]); // MD5
      fixtures.push([...p03b, ...p12b]); // MD6

      // MD7-8: 档内对抗 + 跨档轮空队补赛
      const [in0a, in0b, bye0a, bye0b] = pairIntraBoth(pots[0]);
      const [in1a, in1b, bye1a, bye1b] = pairIntraBoth(pots[1]);
      const [in2a, in2b, bye2a, bye2b] = pairIntraBoth(pots[2]);
      const [in3a, in3b, bye3a, bye3b] = pairIntraBoth(pots[3]);
      // MD7: 16场档内 + 2场跨档轮空队 = 18场
      fixtures.push([...in0a, ...in1a, ...in2a, ...in3a,
        { homeIdx: bye0a, awayIdx: bye1a },
        { homeIdx: bye2a, awayIdx: bye3a }
      ]);
      // MD8: 16场档内 + 2场跨档轮空队 = 18场
      fixtures.push([...in0b, ...in1b, ...in2b, ...in3b,
        { homeIdx: bye0b, awayIdx: bye1b },
        { homeIdx: bye2b, awayIdx: bye3b }
      ]);

      return fixtures;
    }

    function simulateUclMatchday(mdIdx) {
      const matchday = ucl.leagueFixtures[mdIdx];
      const results = [];

      for (const m of matchday) {
        const home = ucl.teams[m.homeIdx];
        const away = ucl.teams[m.awayIdx];
        const result = simulateMatch(home.strength, away.strength);
        m.homeGoals = result.homeGoals;
        m.awayGoals = result.awayGoals;

        const homeIsUser = home.isUser;
        const awayIsUser = away.isUser;

        if (homeIsUser) {
          m.events = generateUserMatchEvents(result.homeGoals, result.awayGoals, "ucl", away.name, away.roster);
          m.isUser = true;
          m.userResult = result.homeGoals > result.awayGoals ? "win" : result.homeGoals < result.awayGoals ? "loss" : "draw";
        } else if (awayIsUser) {
          m.events = generateUserMatchEvents(result.awayGoals, result.homeGoals, "ucl", home.name, home.roster);
          m.isUser = true;
          m.userResult = result.awayGoals > result.homeGoals ? "win" : result.awayGoals < result.homeGoals ? "loss" : "draw";
        } else {
          m.events = generateOppMatchEvents(result.homeGoals, result.awayGoals, home.name, away.name, home.roster, away.roster);
          m.isUser = false;
          m.userResult = null;
        }
        results.push(m);

        // 更新积分榜
        const h = ucl.leagueStandings[m.homeIdx];
        const a = ucl.leagueStandings[m.awayIdx];
        h.played++; a.played++;
        h.gf += result.homeGoals; h.ga += result.awayGoals;
        a.gf += result.awayGoals; a.ga += result.homeGoals;
        if (result.homeGoals > result.awayGoals) {
          h.won++; a.lost++; h.points += 3;
        } else if (result.homeGoals < result.awayGoals) {
          a.won++; h.lost++; a.points += 3;
        } else {
          h.drawn++; a.drawn++; h.points++; a.points++;
        }
      }
      for (const s of ucl.leagueStandings) s.gd = s.gf - s.ga;

      // MD8完成后标记联赛阶段结束
      if (mdIdx === 7) {
        ucl.leaguePhaseDone = true;
        drawUclTies("playoff");
      }
      return results;
    }

    function drawUclTies(roundKey) {
      const round = ucl.knockout[roundKey];
      let teams = [];

      if (roundKey === "playoff") {
        const sorted = [...ucl.leagueStandings].sort((a, b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf);
        teams = sorted.slice(8, 24).map(s => s.idx);
      } else if (roundKey === "r16") {
        const sorted = [...ucl.leagueStandings].sort((a, b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf);
        const top8 = sorted.slice(0, 8).map(s => s.idx);
        const playoffWinners = ucl.knockout.playoff.ties.map(t => t.winnerIdx);
        teams = [...top8, ...playoffWinners];
      } else if (roundKey === "qf") {
        teams = ucl.knockout.r16.ties.map(t => t.winnerIdx);
      } else if (roundKey === "sf") {
        teams = ucl.knockout.qf.ties.map(t => t.winnerIdx);
      }

      const shuffled = [...teams].sort(() => Math.random() - 0.5);
      round.ties = [];
      for (let i = 0; i < shuffled.length; i += 2) {
        round.ties.push({
          teamAIdx: shuffled[i], teamBIdx: shuffled[i + 1],
          teamAName: ucl.teams[shuffled[i]].name,
          teamBName: ucl.teams[shuffled[i + 1]].name,
          leg1: null, leg2: null, aggA: null, aggB: null, winnerIdx: null
        });
      }
    }

    function simulateUclLeg(roundKey, legNum) {
      const round = ucl.knockout[roundKey];

      for (const tie of round.ties) {
        const homeIdx = legNum === 1 ? tie.teamAIdx : tie.teamBIdx;
        const awayIdx = legNum === 1 ? tie.teamBIdx : tie.teamAIdx;
        const home = ucl.teams[homeIdx];
        const away = ucl.teams[awayIdx];
        const result90 = simulateMatch(home.strength, away.strength);
        let homeGoals = result90.homeGoals;
        let awayGoals = result90.awayGoals;
        let et = false;

        // 次回合：两回合总比分打平则进入加时
        if (legNum === 2) {
          const aggA90 = tie.leg1.homeGoals + awayGoals; // teamA: leg1主场 + leg2客场(90分钟)
          const aggB90 = tie.leg1.awayGoals + homeGoals; // teamB: leg1客场 + leg2主场(90分钟)
          if (aggA90 === aggB90) {
            const etResult = simulateExtraTime(home.strength, away.strength);
            homeGoals += etResult.homeGoals;
            awayGoals += etResult.awayGoals;
            et = true;
          }
        }

        const legData = {
          homeIdx, awayIdx,
          homeGoals, awayGoals, et
        };

        const homeIsUser = home.isUser;
        const awayIsUser = away.isUser;
        if (homeIsUser) {
          legData.events = generateUserMatchEvents(homeGoals, awayGoals, "ucl", away.name, away.roster);
          legData.isUser = true;
          legData.userResult = homeGoals > awayGoals ? "win" : homeGoals < awayGoals ? "loss" : "draw";
        } else if (awayIsUser) {
          legData.events = generateUserMatchEvents(awayGoals, homeGoals, "ucl", home.name, home.roster);
          legData.isUser = true;
          legData.userResult = awayGoals > homeGoals ? "win" : awayGoals < homeGoals ? "loss" : "draw";
        } else {
          legData.events = generateOppMatchEvents(homeGoals, awayGoals, home.name, away.name, home.roster, away.roster);
          legData.isUser = false;
          legData.userResult = null;
        }

        if (legNum === 1) {
          tie.leg1 = legData;
        } else {
          tie.leg2 = legData;
          // 计算总比分（已含加时进球）
          tie.aggA = tie.leg1.homeGoals + tie.leg2.awayGoals; // teamA: leg1主场 + leg2客场
          tie.aggB = tie.leg1.awayGoals + tie.leg2.homeGoals; // teamB: leg1客场 + leg2主场
          if (tie.aggA !== tie.aggB) {
            tie.winnerIdx = tie.aggA > tie.aggB ? tie.teamAIdx : tie.teamBIdx;
          } else {
            // 取消客场进球，直接点球
            const penResult = penaltyShootout(tie.teamAIdx, tie.teamBIdx, ucl.teams[tie.teamAIdx].strength, ucl.teams[tie.teamBIdx].strength);
            tie.winnerIdx = penResult.winnerIdx;
            tie.penaltyHome = penResult.homePenalty;
            tie.penaltyAway = penResult.awayPenalty;
          }
        }
      }

      if (legNum === 2) round.done = true;
    }

    function simulateUclFinal() {
      const final = ucl.knockout.final;
      const sfWinners = ucl.knockout.sf.ties.map(t => t.winnerIdx);
      const home = ucl.teams[sfWinners[0]];
      const away = ucl.teams[sfWinners[1]];
      const result90 = simulateMatch(home.strength, away.strength, true); // 中立场地
      let homeGoals = result90.homeGoals;
      let awayGoals = result90.awayGoals;
      let et = false;

      // 90 分钟平局进入加时
      if (homeGoals === awayGoals) {
        const etResult = simulateExtraTime(home.strength, away.strength, true);
        homeGoals += etResult.homeGoals;
        awayGoals += etResult.awayGoals;
        et = true;
      }

      final.match = {
        homeIdx: sfWinners[0], awayIdx: sfWinners[1],
        homeName: home.name, awayName: away.name,
        homeGoals, awayGoals, et
      };

      const homeIsUser = home.isUser;
      const awayIsUser = away.isUser;
      if (homeIsUser) {
        final.match.events = generateUserMatchEvents(homeGoals, awayGoals, "ucl", away.name, away.roster);
        final.match.isUser = true;
        final.match.userResult = homeGoals > awayGoals ? "win" : homeGoals < awayGoals ? "loss" : "draw";
      } else if (awayIsUser) {
        final.match.events = generateUserMatchEvents(awayGoals, homeGoals, "ucl", home.name, home.roster);
        final.match.isUser = true;
        final.match.userResult = awayGoals > homeGoals ? "win" : awayGoals < homeGoals ? "loss" : "draw";
      } else {
        final.match.events = generateOppMatchEvents(homeGoals, awayGoals, home.name, away.name, home.roster, away.roster);
        final.match.isUser = false;
      }

      if (homeGoals !== awayGoals) {
        final.match.winnerIdx = homeGoals > awayGoals ? sfWinners[0] : sfWinners[1];
      } else {
        const penResult = penaltyShootout(sfWinners[0], sfWinners[1], home.strength, away.strength);
        final.match.winnerIdx = penResult.winnerIdx;
        final.match.penaltyHome = penResult.homePenalty;
        final.match.penaltyAway = penResult.awayPenalty;
      }
      final.done = true;
      ucl.champion = ucl.teams[final.match.winnerIdx].name;
    }

    function isUclRoundDone(key) {
      if (!ucl || !ucl.active) return true;
      if (key.startsWith("md")) {
        const mdIdx = parseInt(key.substring(2)) - 1;
        const md = ucl.leagueFixtures[mdIdx];
        return md && md.length > 0 && md[0].homeGoals !== undefined;
      }
      if (key.endsWith("Leg1")) {
        const base = key.replace("Leg1", "");
        const round = ucl.knockout[base];
        return round && round.ties.length > 0 && round.ties[0].leg1 !== null;
      }
      if (key.endsWith("Leg2")) {
        const base = key.replace("Leg2", "");
        const round = ucl.knockout[base];
        return round && round.done;
      }
      return false;
    }

    // 检查用户球队是否在某一足总杯轮次中
    function isUserInCupRound(roundKey) {
      if (!cup || !cup.rounds[roundKey]) return false;
      const teams = cup.rounds[roundKey].teams;
      return teams.length > 0 && teams.some(idx => leagueTeams[idx] && leagueTeams[idx].isUser);
    }

    // 检查用户球队是否在某一欧冠轮次中
    function isUserInUclRound(key) {
      if (!ucl || !ucl.active) return false;
      if (!ucl.userParticipates) return false; // 用户未参加本届欧冠
      if (key.startsWith("md")) return true; // 联赛阶段用户始终参与
      let base = key;
      if (key.endsWith("Leg1")) base = key.replace("Leg1", "");
      else if (key.endsWith("Leg2")) base = key.replace("Leg2", "");
      const round = ucl.knockout[base];
      if (!round || !round.ties) return false;
      return round.ties.some(tie =>
        ucl.teams[tie.teamAIdx].isUser || ucl.teams[tie.teamBIdx].isUser
      );
    }

    // 自动模拟欧冠轮次（不展示赛果）
    function autoSimulateUclRound(key) {
      if (key.startsWith("md")) {
        const mdIdx = parseInt(key.substring(2)) - 1;
        simulateUclMatchday(mdIdx);
      } else if (key.endsWith("Leg1")) {
        const base = key.replace("Leg1", "");
        simulateUclLeg(base, 1);
      } else if (key.endsWith("Leg2")) {
        const base = key.replace("Leg2", "");
        simulateUclLeg(base, 2);
        if (base === "playoff") drawUclTies("r16");
        if (base === "r16") drawUclTies("qf");
        if (base === "qf") drawUclTies("sf");
      }
    }

    function generateFixtures(n) {
      const ids = Array.from({ length: n }, (_, i) => i);
      const halfRounds = n - 1;
      const firstHalf = [];

      for (let r = 0; r < halfRounds; r++) {
        const matches = [];
        for (let i = 0; i < n / 2; i++) {
          const a = ids[i];
          const b = ids[n - 1 - i];
          matches.push(r % 2 === 1 ? { home: a, away: b } : { home: b, away: a });
        }
        firstHalf.push(matches);
        ids.splice(1, 0, ids.pop());
      }

      const secondHalf = firstHalf.map(round =>
        round.map(m => ({ home: m.away, away: m.home }))
      );

      return [...firstHalf, ...secondHalf];
    }

    function simulateMatch(homeStr, awayStr, neutral = false) {
      const homeAdv = neutral ? 0 : 3;
      const noise = () => (Math.random() * 6 - 3);
      const homeRating = homeStr + homeAdv + noise();
      const awayRating = awayStr + noise();
      const diff = homeRating - awayRating;

      let hg, ag;
      if (diff > 9) {
        hg = 2 + Math.floor(Math.random() * 3);
        ag = Math.floor(Math.random() * 2);
      } else if (diff > 4) {
        hg = 1 + Math.floor(Math.random() * 2);
        ag = Math.floor(Math.random() * 2);
      } else if (diff > -4) {
        hg = Math.floor(Math.random() * 3);
        ag = Math.floor(Math.random() * 3);
      } else if (diff > -9) {
        hg = Math.floor(Math.random() * 2);
        ag = 1 + Math.floor(Math.random() * 2);
      } else {
        hg = Math.floor(Math.random() * 2);
        ag = 2 + Math.floor(Math.random() * 3);
      }

      return { homeGoals: hg, awayGoals: ag };
    }

    function simulateExtraTime(homeStr, awayStr, neutral = false) {
      // 30 分钟加时，进球概率低于常规 90 分钟
      const homeAdv = neutral ? 0 : 1.5;
      const noise = () => (Math.random() * 4 - 2);
      const homeRating = homeStr + homeAdv + noise();
      const awayRating = awayStr + noise();
      const diff = homeRating - awayRating;

      let hg = 0, ag = 0;
      const homeProb = diff > 6 ? 0.55 : diff > 2 ? 0.45 : diff > -2 ? 0.35 : diff > -6 ? 0.25 : 0.20;
      const awayProb = diff > 6 ? 0.20 : diff > 2 ? 0.25 : diff > -2 ? 0.35 : diff > -6 ? 0.45 : 0.55;
      if (Math.random() < homeProb) hg = 1;
      if (Math.random() < awayProb) ag = 1;

      return { homeGoals: hg, awayGoals: ag };
    }

    function penaltyShootout(homeIdx, awayIdx, homeStr, awayStr) {
      const hStr = homeStr !== undefined ? homeStr : leagueTeams[homeIdx].strength;
      const aStr = awayStr !== undefined ? awayStr : leagueTeams[awayIdx].strength;
      const total = hStr + aStr;
      const homeWins = Math.random() < (hStr / total);
      // 生成点球比分（胜者进球更多，3-5范围内）
      const loserScore = 2 + Math.floor(Math.random() * 3); // 2-4
      const winnerScore = loserScore + 1 + Math.floor(Math.random() * 2); // 胜者多1-2球
      const homePenalty = homeWins ? winnerScore : loserScore;
      const awayPenalty = homeWins ? loserScore : winnerScore;
      return { winnerIdx: homeWins ? homeIdx : awayIdx, homePenalty, awayPenalty };
    }

    function getNextCupRound(key) {
      const idx = CUP_ROUND_ORDER.indexOf(key);
      return idx < CUP_ROUND_ORDER.length - 1 ? CUP_ROUND_ORDER[idx + 1] : null;
    }

    function weightedPick(entries) {
      const total = entries.reduce((sum, e) => sum + e.weight, 0);
      if (total <= 0) return entries[0];
      let r = Math.random() * total;
      for (const e of entries) {
        r -= e.weight;
        if (r <= 0) return e;
      }
      return entries[entries.length - 1];
    }

    function pickOppScorerAssister(roster, fallbackName) {
      if (!roster || roster.length === 0) return { scorerName: fallbackName, assisterName: null };
      const scorerEntries = roster
        .map(p => ({ name: p.name, weight: (attackWeights[p.positions[0]] || 0) * Math.pow(p.ovr, 3) }))
        .filter(e => e.weight > 0);
      if (scorerEntries.length === 0) return { scorerName: fallbackName, assisterName: null };
      const scorer = weightedPick(scorerEntries);
      const scorerName = scorer.name;
      let assisterName = null;
      if (Math.random() >= 0.25) {
        const assistEntries = roster
          .map(p => ({ name: p.name, weight: (assistWeights[p.positions[0]] || 0) * Math.pow(p.ovr, 3) }))
          .filter(e => e.weight > 0 && e.name !== scorerName);
        if (assistEntries.length > 0) {
          assisterName = weightedPick(assistEntries).name;
        }
      }
      return { scorerName, assisterName };
    }

    function generateUserMatchEvents(userGoals, oppGoals, matchType = "league", oppName = "对方", oppRoster = []) {
      const events = [];
      if (userPlayerStats.length === 0) return events;

      const cleanSheet = oppGoals === 0;
      const activeStats = userPlayerStats.filter(s => !s.replaced);
      const typeKey = matchType === "ucl" ? "ucl" : matchType === "cup" ? "cup" : "league";
      const appearancesKey = `${typeKey}Appearances`;
      const goalsKey = `${typeKey}Goals`;
      const assistsKey = `${typeKey}Assists`;
      const cleanSheetsKey = `${typeKey}CleanSheets`;

      // 上场数
      for (const s of activeStats) {
        s.appearances++;
        s[appearancesKey]++;
      }

      // 进球分布：位置权重 × OVR^3，能力差异更显著
      const scorerEntries = activeStats
        .map(s => ({ ref: s, name: s.player.name, weight: (attackWeights[s.pos] || 0) * Math.pow(s.player.ovr, 3) }))
        .filter(e => e.weight > 0);

      for (let g = 0; g < userGoals; g++) {
        const minute = Math.floor(Math.random() * 90) + 1;
        const scorer = scorerEntries.length > 0 ? weightedPick(scorerEntries) : null;
        events.push({ minute, side: "user", scorerName: scorer ? scorer.name : "未知", assisterName: null });
        if (scorer) {
          scorer.ref.goals++;
          scorer.ref[goalsKey]++;
        }
      }

      // 助攻分布：每个进球25%概率无助攻，75%概率1人助攻
      const assistEntries = activeStats
        .map(s => ({ ref: s, name: s.player.name, weight: (assistWeights[s.pos] || 0) * Math.pow(s.player.ovr, 3) }))
        .filter(e => e.weight > 0);

      for (let i = 0; i < events.length; i++) {
        const e = events[i];
        if (e.side !== "user") continue;
        if (Math.random() < 0.25) continue;
        // 助攻者不能是进球者本人
        const eligible = assistEntries.filter(a => a.name !== e.scorerName);
        if (eligible.length === 0) continue;
        const pick = weightedPick(eligible);
        e.assisterName = pick.name;
        pick.ref.assists++;
        pick.ref[assistsKey]++;
      }

      // 零封
      if (cleanSheet) {
        for (const s of activeStats) {
          if (cleanSheetPositions.includes(s.pos)) {
            s.cleanSheets++;
            s[cleanSheetsKey]++;
          }
        }
      }

      // 对方进球：从对手阵容中选取进球者和助攻者
      for (let g = 0; g < oppGoals; g++) {
        const minute = Math.floor(Math.random() * 90) + 1;
        const { scorerName, assisterName } = pickOppScorerAssister(oppRoster, oppName);
        events.push({ minute, side: "opp", scorerName, assisterName });
      }

      return events.sort((a, b) => a.minute - b.minute);
    }

    function generateOppMatchEvents(homeGoals, awayGoals, homeName, awayName, homeRoster = [], awayRoster = []) {
      const events = [];
      for (let g = 0; g < homeGoals; g++) {
        const minute = Math.floor(Math.random() * 90) + 1;
        const { scorerName, assisterName } = pickOppScorerAssister(homeRoster, homeName);
        events.push({ minute, side: "home", scorerName, assisterName });
      }
      for (let g = 0; g < awayGoals; g++) {
        const minute = Math.floor(Math.random() * 90) + 1;
        const { scorerName, assisterName } = pickOppScorerAssister(awayRoster, awayName);
        events.push({ minute, side: "away", scorerName, assisterName });
      }
      return events.sort((a, b) => a.minute - b.minute);
    }

    function formatMatchEvents(events, userIsHome) {
      if (!events || events.length === 0) return "";
      const userEvents = events.filter(e => e.side === "user");
      const oppEvents = events.filter(e => e.side === "opp");
      const renderUserEvent = (e) => {
        const assistText = e.assisterName ? ` <span style="color:#64748b;">(助：${e.assisterName})</span>` : "";
        return `<div>${e.minute}' ${e.scorerName}${assistText}</div>`;
      };
      const renderOppEvent = (e) => {
        const assistText = e.assisterName ? ` <span style="color:#64748b;">(助：${e.assisterName})</span>` : "";
        return `<div>${e.minute}' ${e.scorerName}${assistText}</div>`;
      };
      const leftEvents = userIsHome ? userEvents.map(renderUserEvent).join("") : oppEvents.map(renderOppEvent).join("");
      const rightEvents = userIsHome ? oppEvents.map(renderOppEvent).join("") : userEvents.map(renderUserEvent).join("");
      const leftColor = userIsHome ? "#34d399" : "#94a3b8";
      const rightColor = userIsHome ? "#94a3b8" : "#34d399";
      return `
        <div style="display:flex; justify-content:space-between; margin-top:4px; font-size:12px; line-height:1.5;">
          <div style="flex:1; text-align:left; color:${leftColor};">${leftEvents}</div>
          <div style="flex:1; text-align:right; color:${rightColor};">${rightEvents}</div>
        </div>`;
    }

    function getMatchScoreColor(isUser, userResult) {

    function simulateRound(roundIdx) {
      const round = fixtures[roundIdx];
      lastRoundResults = [];

      for (const match of round) {
        const home = leagueTeams[match.home];
        const away = leagueTeams[match.away];
        const result = simulateMatch(home.strength, away.strength);

        let events = [];
        let userResult = null;
        if (home.isUser) {
          events = generateUserMatchEvents(result.homeGoals, result.awayGoals, "league", away.name, away.roster);
          userResult = result.homeGoals > result.awayGoals ? "win" : result.homeGoals < result.awayGoals ? "loss" : "draw";
        } else if (away.isUser) {
          events = generateUserMatchEvents(result.awayGoals, result.homeGoals, "league", home.name, home.roster);
          userResult = result.awayGoals > result.homeGoals ? "win" : result.awayGoals < result.homeGoals ? "loss" : "draw";
        } else {
          events = generateOppMatchEvents(result.homeGoals, result.awayGoals, home.name, away.name, home.roster, away.roster);
        }

        lastRoundResults.push({
          homeName: home.name,
          awayName: away.name,
          homeGoals: result.homeGoals,
          awayGoals: result.awayGoals,
          isUser: home.isUser || away.isUser,
          userResult,
          events
        });

        const h = standings[match.home];
        const a = standings[match.away];

        h.played++; a.played++;
        h.gf += result.homeGoals; h.ga += result.awayGoals;
        a.gf += result.awayGoals; a.ga += result.homeGoals;

        if (result.homeGoals > result.awayGoals) {
          h.won++; a.lost++;
          h.points += 3;
        } else if (result.homeGoals < result.awayGoals) {
          h.lost++; a.won++;
          a.points += 3;
        } else {
          h.drawn++; a.drawn++;
          h.points++; a.points++;
        }
      }

      for (const s of standings) {
        s.gd = s.gf - s.ga;
      }
    }

    function drawCupRoundMatches(roundKey) {
      const round = cup.rounds[roundKey];
      const teams = round.teams;
      const shuffled = [...teams].sort(() => Math.random() - 0.5);
      const matches = [];
      for (let i = 0; i < shuffled.length; i += 2) {
        const homeIdx = shuffled[i];
        const awayIdx = shuffled[i + 1];
        matches.push({
          homeIdx, awayIdx,
          homeName: leagueTeams[homeIdx].name,
          awayName: leagueTeams[awayIdx].name
        });
      }
      round.matches = matches;
    }

    function simulateCupRound(roundKey) {
      const round = cup.rounds[roundKey];

      // 使用预抽签的对阵，如果没有则当场抽签
      let matches = round.matches && round.matches.length > 0 ? round.matches : [];
      if (matches.length === 0) {
        const teams = round.teams;
        const shuffled = [...teams].sort(() => Math.random() - 0.5);
        for (let i = 0; i < shuffled.length; i += 2) {
          const homeIdx = shuffled[i];
          const awayIdx = shuffled[i + 1];
          matches.push({
            homeIdx, awayIdx,
            homeName: leagueTeams[homeIdx].name,
            awayName: leagueTeams[awayIdx].name
          });
        }
      }

      const neutralVenue = roundKey === "semiFinals" || roundKey === "final";
      for (const m of matches) {
        const result = simulateMatch(leagueTeams[m.homeIdx].strength, leagueTeams[m.awayIdx].strength, neutralVenue);
        m.homeGoals = result.homeGoals;
        m.awayGoals = result.awayGoals;
        let penaltyHome, penaltyAway;
        if (result.homeGoals !== result.awayGoals) {
          m.winnerIdx = result.homeGoals > result.awayGoals ? m.homeIdx : m.awayIdx;
        } else {
          const penResult = penaltyShootout(m.homeIdx, m.awayIdx);
          m.winnerIdx = penResult.winnerIdx;
          penaltyHome = penResult.homePenalty;
          penaltyAway = penResult.awayPenalty;
        }
        if (penaltyHome !== undefined) {
          m.penaltyHome = penaltyHome;
          m.penaltyAway = penaltyAway;
        }
        m.winnerName = leagueTeams[m.winnerIdx].name;
        // 用户球队参赛时分配数据并生成事件
        if (leagueTeams[m.homeIdx].isUser || leagueTeams[m.awayIdx].isUser) {
          const userIsHome = leagueTeams[m.homeIdx].isUser;
          const userGoals = userIsHome ? result.homeGoals : result.awayGoals;
          const oppGoals = userIsHome ? result.awayGoals : result.homeGoals;
          const oppName = userIsHome ? m.awayName : m.homeName;
          const oppRoster = userIsHome ? leagueTeams[m.awayIdx].roster : leagueTeams[m.homeIdx].roster;
          m.events = generateUserMatchEvents(userGoals, oppGoals, "cup", oppName, oppRoster);
          m.isUser = true;
          m.userResult = userGoals > oppGoals ? "win" : userGoals < oppGoals ? "loss" : "draw";
        } else {
          m.events = generateOppMatchEvents(result.homeGoals, result.awayGoals, m.homeName, m.awayName, leagueTeams[m.homeIdx].roster, leagueTeams[m.awayIdx].roster);
          m.isUser = false;
          m.userResult = null;
        }
      }

      round.matches = matches;
      round.done = true;

      // 推进胜者到下一轮，并立即抽签更新对阵图
      const nextKey = getNextCupRound(roundKey);
      if (nextKey) {
        cup.rounds[nextKey].teams = matches.map(m => m.winnerIdx);
        drawCupRoundMatches(nextKey);
      }

      // 决赛产生冠军
      if (roundKey === "final") {
        cup.champion = leagueTeams[matches[0].winnerIdx].name;
      }
    }

    function buildCumulativeStats() {

            map.set(id, {
              pos: s.pos, goals: 0, assists: 0, cleanSheets: 0, appearances: 0,
              leagueGoals: 0, leagueAssists: 0, leagueCleanSheets: 0, leagueAppearances: 0,
              cupGoals: 0, cupAssists: 0, cupCleanSheets: 0, cupAppearances: 0,
              uclGoals: 0, uclAssists: 0, uclCleanSheets: 0, uclAppearances: 0,
              replaced: false, isTransfer: false,
              playerName: getName(s), playerOvr: getOvr(s), playerAge: getAge(s)
            });
          }
          const e = map.get(id);
          e.goals += s.goals; e.assists += s.assists;
          e.cleanSheets += s.cleanSheets; e.appearances += s.appearances;
          e.leagueGoals += s.leagueGoals || 0; e.leagueAssists += s.leagueAssists || 0;

          e.uclCleanSheets += s.uclCleanSheets || 0; e.uclAppearances += s.uclAppearances || 0;
