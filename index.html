    // ===== 赛季个人奖项 =====
    function playerCategory(pos) {
      if (!pos) return "MID";
      if (pos === "GK") return "GK";
      if (["CB", "RB", "LB", "RWB", "LWB"].includes(pos)) return "DEF";
      if (["ST", "CF", "SS"].includes(pos)) return "FWD";
      return "MID";
    }

    // 为电脑球员按位置和能力合成单赛季某项赛事的数据（进球/助攻/零封按位置区分）
    // 使用幂次曲线：顶级前锋约25-30球/赛季，与用户球队真实数据同一量级
    function synthCompStats(player, matches, csRate, gkRank = 0, attackMult = 1, concedeRate = 1.2) {
      const cat = playerCategory(player.positions[0]);
      const ovr = player.ovr;
      const noise = () => 0.6 + Math.random() * 0.8;
      let apps = Math.max(1, Math.round(matches * (0.7 + Math.random() * 0.3)));
      const x = Math.max(0, ovr - 55);
      let goals = 0, assists = 0, cleanSheets = 0, conceded = 0;
      if (cat === "GK") {
        // 按门将顺位分配出场、零封与丢球（各顺位独立随机）：
        // 一门60%概率全勤(100%)，否则85%-95%；二门10%-25%；三门及以下0-5%
        const share = gkRank === 0
          ? (Math.random() < 0.6 ? 1 : 0.85 + Math.random() * 0.1)
          : gkRank === 1 ? 0.1 + Math.random() * 0.15
          : Math.random() * 0.05;
        apps = Math.max(1, Math.round(matches * share));
        cleanSheets = Math.round(matches * csRate * share * (0.9 + Math.random() * 0.2));
        conceded = Math.round(matches * concedeRate * share * (0.9 + Math.random() * 0.2));
      } else if (cat === "DEF") {
        // 中后卫：进球概率提升、助攻概率下降；边后卫：助攻概率提升、进球略降
        const pos0 = player.positions[0];
        if (pos0 === "CB") {
          goals = Math.round(Math.pow(x, 1.8) * 0.00022 * matches * noise() * attackMult);
          assists = Math.round(Math.pow(x, 1.4) * 0.00008 * matches * noise() * attackMult);
        } else {
          goals = Math.round(Math.pow(x, 1.5) * 0.00012 * matches * noise() * attackMult);
          assists = Math.round(Math.pow(x, 1.9) * 0.00028 * matches * noise() * attackMult);
        }
        cleanSheets = Math.round(matches * csRate * (0.3 + Math.random() * 0.6));
      } else if (cat === "MID") {
        goals = Math.round(Math.pow(x, 2.2) * 0.00012 * matches * noise() * attackMult);
        assists = Math.round(Math.pow(x, 2.2) * 0.00015 * matches * noise() * attackMult);
        cleanSheets = Math.round(matches * csRate * (0.1 + Math.random() * 0.25));
      } else {
        goals = Math.round(Math.pow(x, 2.6) * 0.00006 * matches * noise() * attackMult);
        assists = Math.round(Math.pow(x, 1.9) * 0.00016 * matches * noise() * attackMult);
      }
      return { goals, assists, cleanSheets, conceded, apps };
    }

    // 三条线能力加权总和（自定义权重）
    function lineWeightedSum(roster, weights) {
      let sum = 0;
      for (const p of roster) {
        const pos = p.positions[0];
        let w;
        if (pos === "GK") w = weights.gk;
        else if (["CB", "RB", "LB", "RWB", "LWB"].includes(pos)) w = weights.def;
        else if (["ST", "CF", "SS"].includes(pos)) w = weights.fwd;
        else w = weights.mid;
        sum += p.ovr * w;
      }
      return sum;
    }

    // 防守权重：门将4/后卫3/中场2/锋线1 → 零封率
    function teamCsRate(roster) {
      // 按11人首发的能力总和映射（首发总和约1600-2250）
      const sum = lineWeightedSum(roster, { gk: 4, def: 3, mid: 2, fwd: 1 });
      return Math.min(0.40, Math.max(0.15, (sum - 900) / 3500));
    }

    // 同样的防守权重 → 每场丢球期望（防守越强丢球越少）
    function teamConcedeRate(roster) {
      const sum = lineWeightedSum(roster, { gk: 4, def: 3, mid: 2, fwd: 1 });
      return Math.min(2.4, Math.max(0.45, 5.4 - sum / 460));
    }

    // 攻击权重相反：锋线4/中场3/后卫2/门将1 → 每场进球期望
    function teamGoalRate(roster) {
      // 按11人首发的能力总和映射（首发总和约1600-2510）
      const sum = lineWeightedSum(roster, { gk: 1, def: 2, mid: 3, fwd: 4 });
      return Math.min(2.6, Math.max(0.9, (sum - 600) / 950));
    }

    // 按能力排序的门将顺位（0=一门，1=二门...），用于让主力门将获得绝大多数零封
    function buildGkRankFn(roster) {
      const gks = roster.filter(p => playerCategory(p.positions[0]) === "GK").sort((a, b) => b.ovr - a.ovr);
      const map = {};
      gks.forEach((g, i) => { map[g.id] = i; });
      return (p) => map[p.id] !== undefined ? map[p.id] : 0;
    }

    function countCupMatches(teamIdx) {
      let n = 0;
      for (const key of CUP_ROUND_ORDER) {
        const round = cup.rounds[key];
        if (!round || !round.matches) continue;
        for (const m of round.matches) {
          if (m.homeIdx === teamIdx || m.awayIdx === teamIdx) n++;
        }
      }
      return n;
    }

    function countUclMatches(teamIdx) {
      let n = 0;
      if (!ucl || !ucl.active) return 0;
      for (const md of ucl.leagueFixtures || []) {
        for (const m of md) {
          if (m.homeIdx === teamIdx || m.awayIdx === teamIdx) n++;
        }
      }
      const kd = ucl.knockout;
      if (kd) {
        for (const key of ["playoff", "r16", "qf", "sf"]) {
          const round = kd[key];
          if (!round || !round.ties) continue;
          for (const t of round.ties) {
            if (t.teamAIdx === teamIdx || t.teamBIdx === teamIdx) {
              if (t.leg1) n++;
              if (t.leg2) n++;
            }
          }
        }
        if (kd.final && kd.final.match &&
            (kd.final.match.homeIdx === teamIdx || kd.final.match.awayIdx === teamIdx)) n++;
      }
      return n;
    }

    // 团队荣誉加分
    function leagueTeamBonus(teamName) {
      const sorted = [...standings].sort((a, b) =>
        b.points - a.points || b.gd - a.gd || b.gf - a.gf
      );
      const idx = sorted.findIndex(s => s.name === teamName);
      if (idx < 0) return 0;
      if (idx === 0) return 30;
      if (idx <= 3) return 18;
      if (idx <= 7) return 10;
      if (idx <= 11) return 4;
      return 0;
    }

    function cupTeamBonus(teamName) {
      if (!cup) return 0;
      if (cup.champion === teamName) return 18;
      const reached = (key) => cup.rounds[key] && cup.rounds[key].matches &&
        cup.rounds[key].matches.some(m => m.homeName === teamName || m.awayName === teamName);
      if (reached("final")) return 11;
      if (reached("semiFinals")) return 6;
      if (reached("quarterFinals")) return 3;
      return 0;
    }

    function uclTeamBonus(teamName) {
      if (!ucl || !ucl.active) return 0;
      if (ucl.champion === teamName) return 45; // 欧冠冠军加成最高
      const fm = ucl.knockout.final && ucl.knockout.final.match;
      if (fm && (fm.homeName === teamName || fm.awayName === teamName)) return 28;
      const inTies = (key) => ucl.knockout[key] && ucl.knockout[key].ties &&
        ucl.knockout[key].ties.some(t => t.teamAName === teamName || t.teamBName === teamName);
      if (inTies("sf")) return 18;
      if (inTies("qf")) return 10;
      return 0;
    }

    // MVP评分：数据按位置区分（前锋看进球，中场看重进球+助攻，后卫看零封+防守数据，门将看零封）
    // 各位置顶级赛季的数据分应接近：前锋28球6助≈69 / 中场12球16助≈65 / 后卫5球6助15零封≈61 / 门将18零封≈63
    function mvpDataScore(e, st) {
      if (e.cat === "GK") return st.cleanSheets * 3.5;
      if (e.cat === "DEF") return st.goals * 2.2 + st.assists * 1.8 + st.cleanSheets * 3.0;
      if (e.cat === "MID") return st.goals * 2.5 + st.assists * 2.2;
      return st.goals * 2.2 + st.assists * 1.3;
    }

    function mvpScore(e, st, teamBonus) {
      return mvpDataScore(e, st) + (e.player.ovr - 70) * 0.8 + teamBonus;
    }

    function computeSeasonAwards() {
      const map = new Map();
      const addComp = (player, teamName, isUser, comp, stats) => {
        let e = map.get(player.id);
        if (!e) {
          e = { player, teamName, isUser, cat: playerCategory(player.positions[0]), league: null, cup: null, ucl: null };
          map.set(player.id, e);
        }
        e[comp] = stats;
      };

      // 预处理记录的固定首发11人（阵型+球员确定），模拟数据只分配给这些球员
      const draftedIds = new Set(draftPicks.filter(Boolean).map(p => p.id));
      const teamLineupIds = {};
      for (const td of allTeams) {
        if (td.lineup && td.lineup.length) teamLineupIds[td.name] = td.lineup;
      }
      const lineupRoster = (t) => {
        const ids = teamLineupIds[t.name];
        if (!ids || ids.length === 0) return t.roster || [];
        return ids
          .map(id => allPlayers.find(p => p.id === id))
          .filter(p => p && !draftedIds.has(p.id));
      };

      // 联赛（除用户队外的19队）
      for (let i = 1; i < Math.min(20, leagueTeams.length); i++) {
        const t = leagueTeams[i];
        const roster = lineupRoster(t);
        if (roster.length === 0) continue;
        const csRate = teamCsRate(roster);
        const concedeRate = teamConcedeRate(roster);
        const attackMult = Math.min(1.3, Math.max(0.7, teamGoalRate(roster) / 1.7));
        const gkRankOf = buildGkRankFn(roster);
        for (const p of roster) {
          addComp(p, t.name, false, "league", synthCompStats(p, 38, csRate, gkRankOf(p), attackMult, concedeRate));
        }
      }

      // 足总杯（全部64队）
      for (let i = 0; i < leagueTeams.length; i++) {
        const t = leagueTeams[i];
        const roster = lineupRoster(t);
        if (roster.length === 0) continue;
        const matches = countCupMatches(i);
        if (matches === 0) continue;
        const csRate = teamCsRate(roster);
        const concedeRate = teamConcedeRate(roster);
        const attackMult = Math.min(1.3, Math.max(0.7, teamGoalRate(roster) / 1.7));
        const gkRankOf = buildGkRankFn(roster);
        for (const p of roster) {
          addComp(p, t.name, i === 0, "cup", synthCompStats(p, matches, csRate, gkRankOf(p), attackMult, concedeRate));
        }
      }

      // 欧冠（36队，若参赛）
      if (ucl && ucl.active) {
        for (let i = 0; i < ucl.teams.length; i++) {
          const t = ucl.teams[i];
          const roster = lineupRoster(t);
          if (roster.length === 0) continue;
          const matches = countUclMatches(i);
          if (matches === 0) continue;
          const csRate = teamCsRate(roster);
          const concedeRate = teamConcedeRate(roster);
          const attackMult = Math.min(1.3, Math.max(0.7, teamGoalRate(roster) / 1.7));
          const gkRankOf = buildGkRankFn(roster);
          for (const p of roster) {
            addComp(p, t.name, !!t.isUser, "ucl", synthCompStats(p, matches, csRate, gkRankOf(p), attackMult, concedeRate));
          }
        }
      }

      // 用户球队：用真实统计覆盖
      for (const s of userPlayerStats) {
        if (!s.player) continue;
        let e = map.get(s.player.id);
        if (!e) {
          e = { player: s.player, teamName: "我的球队", isUser: true, cat: playerCategory(s.pos), league: null, cup: null, ucl: null };
          map.set(s.player.id, e);
        } else {
          e.isUser = true;
          e.teamName = "我的球队";
          e.cat = playerCategory(s.pos);
        }
        if (s.leagueAppearances > 0) e.league = { goals: s.leagueGoals, assists: s.leagueAssists, cleanSheets: s.leagueCleanSheets, apps: s.leagueAppearances };
        if (s.cupAppearances > 0) e.cup = { goals: s.cupGoals, assists: s.cupAssists, cleanSheets: s.cupCleanSheets, apps: s.cupAppearances };
        if (s.uclAppearances > 0) e.ucl = { goals: s.uclGoals, assists: s.uclAssists, cleanSheets: s.uclCleanSheets, apps: s.uclAppearances };
      }

      const entries = Array.from(map.values());
      const winner = (e) => ({ name: e.player.name, teamName: e.teamName, isUser: e.isUser });
      const topStat = (comp, key, minApps, gkOnly) => {
        let best = null;
        for (const e of entries) {
          const st = e[comp];
          if (!st || st.apps < minApps) continue;
          if (gkOnly && e.cat !== "GK") continue;
          if (st[key] <= 0) continue;
          if (!best || st[key] > best[comp][key]) best = e;
        }
        return best;
      };

      const awards = [];
      const compAwards = (comp, compName, minApps, bonusFn) => {
        const boot = topStat(comp, "goals", minApps, false);
        if (boot) awards.push({ title: compName + "金靴", winner: winner(boot), valueText: boot[comp].goals + "球" });
        const asst = topStat(comp, "assists", minApps, false);
        if (asst) awards.push({ title: compName + "助攻王", winner: winner(asst), valueText: asst[comp].assists + "助攻" });
        const glove = topStat(comp, "cleanSheets", comp === "league" ? 8 : 1, true);
        if (glove) awards.push({ title: compName + "金手套", winner: winner(glove), valueText: glove[comp].cleanSheets + "零封" });
        let mvp = null;
        for (const e of entries) {
          const st = e[comp];
          if (!st || st.apps < minApps) continue;
          const score = mvpScore(e, st, bonusFn(e.teamName));
          if (!mvp || score > mvp.score) mvp = { e, score };
        }
        if (mvp) awards.push({ title: compName + "MVP", winner: winner(mvp.e), valueText: "MVP" });
      };

      compAwards("league", "联赛", 10, leagueTeamBonus);
      compAwards("cup", "足总杯", 2, cupTeamBonus);
      if (ucl && ucl.active) compAwards("ucl", "欧冠", 3, uclTeamBonus);

      // 欧洲金靴：三项赛事进球合计
      const totalGoals = (e) => (e.league ? e.league.goals : 0) + (e.cup ? e.cup.goals : 0) + (e.ucl ? e.ucl.goals : 0);
      let euroBoot = null;
      for (const e of entries) {
        const g = totalGoals(e);
        if (g <= 0) continue;
        if (!euroBoot || g > euroBoot.g) euroBoot = { e, g };
      }
      if (euroBoot) awards.push({ title: "欧洲金靴奖", winner: winner(euroBoot.e), valueText: euroBoot.g + "球" });

      // 金球奖 / 金童奖：三项赛事数据+团队荣誉+能力综合
      const ballonData = (e) => {
        const g = totalGoals(e);
        const a = (e.league ? e.league.assists : 0) + (e.cup ? e.cup.assists : 0) + (e.ucl ? e.ucl.assists : 0);
        const cs = (e.league ? e.league.cleanSheets : 0) + (e.cup ? e.cup.cleanSheets : 0) + (e.ucl ? e.ucl.cleanSheets : 0);
        if (e.cat === "GK") return cs * 3.5;
        if (e.cat === "DEF") return g * 2.2 + a * 1.8 + cs * 3.0;
        if (e.cat === "MID") return g * 2.5 + a * 2.2;
        return g * 2.2 + a * 1.3;
      };
      const ballonScore = (e) => ballonData(e) + (e.player.ovr - 70) * 1.0 +
        leagueTeamBonus(e.teamName) + cupTeamBonus(e.teamName) + uclTeamBonus(e.teamName);
      let ballon = null, goldenBoy = null;
      for (const e of entries) {
        const apps = (e.league ? e.league.apps : 0) + (e.cup ? e.cup.apps : 0) + (e.ucl ? e.ucl.apps : 0);
        if (apps < 10) continue;
        const score = ballonScore(e);
        if (!ballon || score > ballon.score) ballon = { e, score };
        if (e.player.age <= 21 && (!goldenBoy || score > goldenBoy.score)) goldenBoy = { e, score };
      }
      if (ballon) awards.push({ title: "金球奖", winner: winner(ballon.e), valueText: "" });
      if (goldenBoy) awards.push({ title: "金童奖", winner: winner(goldenBoy.e), valueText: "" });

      return awards;
    }

    function buildAwardsHtml(awards) {
      if (!awards || awards.length === 0) return "";
      const rows = awards.map(a => {
        const nameColor = a.winner.isUser ? "#34d399" : "#e2e8f0";
        return `
          <div class="award-winner-row" data-name="${a.winner.name}" style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #1e293b; font-size:13px; cursor:pointer;">
            <span style="color:#94a3b8; flex:0 0 auto; min-width:120px;">🏆 ${a.title}</span>
            <span style="flex:1; text-align:left; padding-left:6px;"><span style="color:${nameColor}; font-weight:600;">${a.winner.name}</span> <span style="color:#64748b; font-size:12px;">${a.winner.teamName}</span></span>
            <span style="color:#facc15; font-weight:700; white-space:nowrap;">${a.valueText}</span>
          </div>`;
      }).join("");
      return `
        <div style="margin-top:20px;">
          <div style="margin-bottom:12px; font-weight:700; color:#facc15;">赛季个人奖项</div>
          <div style="background:#0f172a; border-radius:8px; padding:10px 14px;">${rows}</div>
        </div>`;
    }

    // 赛季总结弹窗：各项赛事成绩 + 个人奖项
    function showSeasonSummary() {
      const sorted = [...standings].sort((a, b) =>
        b.points - a.points || b.gd - a.gd || b.gf - a.gf
      );
      const myRank = sorted.findIndex(s => s.isUser) + 1;
      const champSpan = (name) => {
        const isMe = name === "我的球队";
        return `<span style="color:${isMe ? "#34d399" : "#e2e8f0"}; font-weight:700;">${name}${isMe ? " (我)" : ""}</span>`;
      };
      const cupResultOf = (cupData) => {
        if (!cupData || !cupData.champion) return "未参赛";
        if (cupData.champion === "我的球队") return "冠军";
        const reached = (key) => cupData.rounds[key] && cupData.rounds[key].matches &&
          cupData.rounds[key].matches.some(m => m.homeName === "我的球队" || m.awayName === "我的球队");
        if (reached("final")) return "亚军";
        if (reached("semiFinals")) return "4强";
        if (reached("quarterFinals")) return "8强";
        if (reached("roundOf16")) return "16强";
        if (reached("roundOf32")) return "32强";
        if (reached("roundOf64")) return "64强";
        return "—";
      };
      const uclResultOf = (uclData) => {
        if (!uclData || !uclData.active) return "未参赛";
        if (uclData.userParticipates === false) return "未参赛";
        if (uclData.champion === "我的球队") return "冠军";
        const fm = uclData.knockout.final && uclData.knockout.final.match;
        if (fm && (fm.homeName === "我的球队" || fm.awayName === "我的球队")) return "亚军";
        const inTies = (key) => uclData.knockout[key] && uclData.knockout[key].ties &&
          uclData.knockout[key].ties.some(t => t.teamAName === "我的球队" || t.teamBName === "我的球队");
        if (inTies("sf")) return "4强";
        if (inTies("qf")) return "8强";
        if (inTies("r16")) return "16强";
        if (inTies("playoff")) return "附加赛";
        return "联赛阶段";
      };
      const row = (label, value) => `<div style="display:flex; justify-content:space-between; font-size:13px; padding:2px 0;">
        <span style="color:#94a3b8;">${label}</span>
        <span>${value}</span>
      </div>`;

      const items = [];
      items.push(`
        <div style="background:#0f172a; border-radius:8px; padding:12px 14px;">
          <div style="font-weight:700; color:#34d399; margin-bottom:6px;">联赛</div>
          ${row("我的球队排名", `<span style="color:#e2e8f0; font-weight:700;">第 ${myRank} 名</span>`)}
          ${row("冠军", champSpan(sorted[0].name))}
        </div>`);
      items.push(`
        <div style="background:#0f172a; border-radius:8px; padding:12px 14px;">
          <div style="font-weight:700; color:#facc15; margin-bottom:6px;">足总杯</div>
          ${row("我的球队成绩", `<span style="color:#e2e8f0; font-weight:600;">${cupResultOf(cup)}</span>`)}
          ${row("冠军", champSpan(cup.champion))}
        </div>`);
      if (ucl && ucl.active) {
        items.push(`
          <div style="background:#0f172a; border-radius:8px; padding:12px 14px;">
            <div style="font-weight:700; color:#60a5fa; margin-bottom:6px;">欧冠</div>
            ${row("我的球队成绩", `<span style="color:#e2e8f0; font-weight:600;">${uclResultOf(ucl)}</span>`)}
            ${row("冠军", champSpan(ucl.champion))}
          </div>`);
      }

      seasonSummaryTitle.textContent = `${seasonLabel(currentSeason)} 赛季总结`;
      seasonSummaryContent.innerHTML = items.join("") + buildAwardsHtml(seasonAwards);
      seasonSummaryBody.scrollTop = 0; // 每次打开从头看
      seasonSummaryModal.style.display = "flex";
    }

    // ===== 球员生涯弹窗 =====
    let careerModalPlayer = null;
    let careerFilter = "all";

    function openPlayerCareer(name) {
      const live = allPlayers.find(p => p.name === name);
      // 历史各赛季数据（按姓名匹配，转生后姓名带+视为另一名球员）
      const seasons = [];
      for (const h of seasonHistory) {
        const s = h.stats.find(st => st.playerName === name);
        if (s) seasons.push({ seasonNum: h.seasonNum, s });
      }
      const cur = userPlayerStats.find(s => s.player && s.player.name === name);
      if (cur) seasons.push({ seasonNum: currentSeason, s: cur });
      // 荣誉（历史各赛季奖项 + 当前赛季已评选奖项）
      const honors = [];
      const pushHonors = (list, label) => {
        if (!list) return;
        for (const a of list) {
          if (a.winner && a.winner.name === name) honors.push({ season: label, title: a.title, valueText: a.valueText || "" });
        }
      };
      for (const h of seasonHistory) {
        if (h.awards) pushHonors(h.awards, seasonLabel(h.seasonNum));
      }
      pushHonors(seasonAwards, seasonLabel(currentSeason));
      careerModalPlayer = { name, seasons, honors };
      careerFilter = "all";
      pcmFilter.value = "all";
      // 标题与信息
      let titleHtml = name;
      let info;
      if (live) {
        const badge = tianyanMode
          ? `<span class="ovr-badge" style="margin-left:6px; padding:2px 6px; font-size:11px;">${live.ovr}</span>`
          : getStarBadge(live.ovr);
        titleHtml += badge;
        info = `${live.age}岁 · ${live.positions.join(" / ")}`;
      } else {
        const last = seasons[seasons.length - 1];
        const ovr = last ? (last.s.playerOvr !== undefined ? last.s.playerOvr : (last.s.player ? last.s.player.ovr : null)) : null;
        const age = last ? (last.s.playerAge !== undefined ? last.s.playerAge : (last.s.player ? last.s.player.age : null)) : null;
        if (ovr !== null && ovr !== undefined) {
          titleHtml += tianyanMode
            ? `<span class="ovr-badge" style="margin-left:6px; padding:2px 6px; font-size:11px;">${ovr}</span>`
            : getStarBadge(ovr);
        }
        info = `${age !== null && age !== undefined ? age + "岁" : ""} · 已离队`;
      }
      pcmTitle.innerHTML = titleHtml;
      pcmInfo.textContent = info;
      renderPlayerCareer();
      pcmBody.scrollTop = 0; // 每次打开从头看
      playerCareerModal.style.display = "flex";
    }

    function renderPlayerCareer() {
      const data = careerModalPlayer;
      if (!data) return;
      // 荣誉折叠展示（类似分享图片）：只显示数量与赛季，团队荣誉为在队期间随队获得的冠军
      const seasonLabels = data.seasons.map(({ seasonNum }) => seasonLabel(seasonNum));
      const teamHonors = [
        { title: "联赛冠军", list: championshipSeasons },
        { title: "足总杯冠军", list: cupSeasons },
        { title: "欧冠冠军", list: uclSeasons }
      ].map(h => ({ title: h.title, seasons: seasonLabels.filter(l => h.list.includes(l)) }))
        .filter(h => h.seasons.length > 0);
      const honorGroups = [];
      for (const h of data.honors) {
        let g = honorGroups.find(x => x.title === h.title);
        if (!g) { g = { title: h.title, seasons: [] }; honorGroups.push(g); }
        g.seasons.push(h.season);
      }
      const honorRow = (title, count, seasons) => `
        <div style="padding:3px 0; border-bottom:1px solid #1e293b;">
          <div style="display:flex; justify-content:space-between; font-size:13px;">
            <span style="color:#e2e8f0; font-weight:600;">🏆 ${title}</span>
            <span style="color:#facc15; font-weight:700;">×${count}</span>
          </div>
          <div style="font-size:11px; color:#64748b;">${seasons.join(" · ")}</div>
        </div>`;
      const honorBlock = (label, rowsHtml) => rowsHtml
        ? `<div style="margin-bottom:8px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:4px;">${label}</div>
            ${rowsHtml}
          </div>`
        : "";
      const teamRows = teamHonors.map(h => honorRow(h.title, h.seasons.length, h.seasons)).join("");
      const personalRows = honorGroups.map(g => honorRow(g.title, g.seasons.length, g.seasons)).join("");
      pcmHonors.innerHTML = (teamHonors.length > 0 || honorGroups.length > 0)
        ? `<div style="margin-top:14px;">
            <div style="font-weight:700; color:#facc15; margin-bottom:6px;">荣誉</div>
            ${honorBlock("团队荣誉", teamRows)}
            ${honorBlock("个人荣誉", personalRows)}
          </div>`
        : `<div style="margin-top:14px; color:#64748b; font-size:13px;">暂无荣誉</div>`;
      if (data.seasons.length === 0) {
        pcmCareerSection.style.display = "none";
        return;
      }
      pcmCareerSection.style.display = "";
      const comp = careerFilter;
      const rows = data.seasons.map(({ seasonNum, s }) => {
        const st = comp === "all"
          ? { apps: s.appearances || 0, g: s.goals || 0, a: s.assists || 0, cs: s.cleanSheets || 0 }
          : {
              apps: s[comp + "Appearances"] || 0,
              g: s[comp + "Goals"] || 0,
              a: s[comp + "Assists"] || 0,
              cs: s[comp + "CleanSheets"] || 0
            };
        const isCsPos = cleanSheetPositions.includes(s.pos);
        return { label: seasonLabel(seasonNum), apps: st.apps, g: st.g, a: st.a, cs: st.cs, isCsPos };
      }).filter(r => r.apps > 0);
      const totals = rows.reduce((t, r) => { t.apps += r.apps; t.g += r.g; t.a += r.a; t.cs += r.cs; return t; }, { apps: 0, g: 0, a: 0, cs: 0 });
      const anyCs = rows.some(r => r.isCsPos);
      pcmTable.innerHTML = `
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead><tr style="color:#94a3b8; border-bottom:2px solid #475569;">
            <th style="text-align:left; padding:6px 4px;">赛季</th>
            <th style="text-align:center; padding:6px 4px;">上场</th>
            <th style="text-align:center; padding:6px 4px;">进球</th>
            <th style="text-align:center; padding:6px 4px;">助攻</th>
            <th style="text-align:center; padding:6px 4px;">零封</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `<tr style="border-bottom:1px solid #334155;">
              <td style="padding:6px 4px; color:#94a3b8;">${r.label}</td>
              <td style="text-align:center; padding:6px 4px;">${r.apps}</td>
              <td style="text-align:center; padding:6px 4px;">${r.g}</td>
              <td style="text-align:center; padding:6px 4px;">${r.a}</td>
              <td style="text-align:center; padding:6px 4px;">${r.isCsPos ? r.cs : "-"}</td>
            </tr>`).join("")}
            <tr style="border-top:2px solid #475569; color:#facc15; font-weight:700;">
              <td style="padding:6px 4px;">合计</td>
              <td style="text-align:center; padding:6px 4px;">${totals.apps}</td>
              <td style="text-align:center; padding:6px 4px;">${totals.g}</td>
              <td style="text-align:center; padding:6px 4px;">${totals.a}</td>
              <td style="text-align:center; padding:6px 4px;">${anyCs ? totals.cs : "-"}</td>
            </tr>
          </tbody>
        </table>`;
    }

    function renderLeague() {
      const isFinished = currentRound >= fixtures.length;
      const half = Math.floor(fixtures.length / 2);
      const isCurrent = viewSeason === "current";

      // 赛季选择器
      const seasonOptions = [
        `<option value="current" ${isCurrent ? 'selected' : ''}>${seasonLabel(currentSeason)}（当前）</option>`,
        ...seasonHistory.map(s => `<option value="${s.seasonNum}" ${viewSeason == String(s.seasonNum) ? 'selected' : ''}>${seasonLabel(s.seasonNum)}</option>`),
        `<option value="cumulative" ${viewSeason === 'cumulative' ? 'selected' : ''}>累计统计</option>`
      ].join('');
      const seasonSelector = seasonHistory.length > 0
        ? `<div style="margin-bottom:16px;"><select id="seasonSelect" style="background:#1e293b; color:#e2e8f0; border:1px solid #475569; border-radius:6px; padding:6px 10px; font-size:14px;">${seasonOptions}</select></div>`
        : '';

      if (isCurrent) {
        // 找到用户下一轮的对手
        let nextOpponent = null;
        let nextVenue = "";
        if (!isFinished) {
          const round = fixtures[currentRound];
          for (const m of round) {
            if (leagueTeams[m.home].isUser) {
              nextOpponent = leagueTeams[m.away].name;
              nextVenue = "主";
              break;
            } else if (leagueTeams[m.away].isUser) {
              nextOpponent = leagueTeams[m.home].name;
              nextVenue = "客";
              break;
            }
          }
        }

        // 联赛结束后检查欧冠决赛（杯赛决赛已在赛程中处理）
        if (isFinished && ucl && ucl.active && ucl.knockout.sf.done && !uclFinalPending && !ucl.knockout.final.done && cup && cup.rounds.final.done) {
          const sfWinners = ucl.knockout.sf.ties.map(t => t.winnerIdx);
          const userInFinal = sfWinners.some(idx => ucl.teams[idx].isUser);
          if (userInFinal) {
            uclFinalPending = true;
          } else {
            // 用户未进决赛，自动模拟
            simulateUclFinal();
          }
        }

        // 赛季全部结束（联赛+足总杯+欧冠）后计算个人奖项并弹出赛季总结
        if (isFinished && cup && cup.rounds.final.done && (!ucl || !ucl.active || ucl.knockout.final.done)) {
          if (!seasonAwards) {
            seasonAwards = computeSeasonAwards();
            showSeasonSummary();
          }
        }

        const hasAnyPending = cupFinalPending || uclSfPending || uclFinalPending || uclRoundPending || cupRoundPending;

        if (uclFinalPending) {
          currentPosName.style.color = '#60a5fa';
          currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠决赛`;
        } else if (isFinished && cupFinalPending) {
          const cupMatches = cup.rounds.final.matches || [];
          let cupOpponent = null;
          let cupVenue = "";
          for (const m of cupMatches) {
            if (leagueTeams[m.homeIdx].isUser) {
              cupOpponent = m.awayName;
              cupVenue = "中";
              break;
            } else if (leagueTeams[m.awayIdx].isUser) {
              cupOpponent = m.homeName;
              cupVenue = "中";
              break;
            }
          }
          currentPosName.style.color = '#facc15';
          if (cupOpponent) {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 足总杯决赛 · 对手：${cupOpponent}（${cupVenue}）`;
          } else {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 足总杯决赛`;
          }
        } else if (uclSfPending) {
          const sfRound = ucl.knockout.sf;
          const hasLeg1 = sfRound.ties.length > 0 && sfRound.ties[0].leg1;
          const legText = hasLeg1 ? "次回合" : "首回合";
          // 查找用户的对手
          let sfOpponent = null;
          for (const tie of sfRound.ties) {
            if (ucl.teams[tie.teamAIdx].isUser) { sfOpponent = ucl.teams[tie.teamBIdx].name; break; }
            if (ucl.teams[tie.teamBIdx].isUser) { sfOpponent = ucl.teams[tie.teamAIdx].name; break; }
          }
          currentPosName.style.color = '#60a5fa';
          if (sfOpponent) {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠半决赛${legText} · 对手：${sfOpponent}`;
          } else {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠半决赛${legText}`;
          }
        } else if (uclRoundPending) {
          const uclKey = uclRoundPending;
          let uclOpponent = null;
          let uclVenue = "";
          if (uclKey.startsWith("md")) {
            const mdIdx = parseInt(uclKey.substring(2)) - 1;
            const matchday = ucl.leagueFixtures[mdIdx];
            if (matchday) {
              for (const m of matchday) {
                if (ucl.teams[m.homeIdx].isUser) { uclOpponent = ucl.teams[m.awayIdx].name; uclVenue = "主"; break; }
                if (ucl.teams[m.awayIdx].isUser) { uclOpponent = ucl.teams[m.homeIdx].name; uclVenue = "客"; break; }
              }
            }
          } else {
            // knockout: playoffLeg1, r16Leg2, qfLeg1, sfLeg2 etc.
            let baseKey = uclKey;
            const isLeg1 = uclKey.endsWith("Leg1");
            const isLeg2 = uclKey.endsWith("Leg2");
            if (isLeg1) baseKey = uclKey.replace("Leg1", "");
            else if (isLeg2) baseKey = uclKey.replace("Leg2", "");
            const round = ucl.knockout[baseKey];
            if (round && round.ties) {
              for (const tie of round.ties) {
                if (ucl.teams[tie.teamAIdx].isUser) {
                  uclOpponent = ucl.teams[tie.teamBIdx].name;
                  uclVenue = isLeg1 ? "主" : "客";
                  break;
                }
                if (ucl.teams[tie.teamBIdx].isUser) {
                  uclOpponent = ucl.teams[tie.teamAIdx].name;
                  uclVenue = isLeg1 ? "客" : "主";
                  break;
                }
              }
            }
          }
          currentPosName.style.color = '#60a5fa';
          if (uclOpponent) {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠${UCL_ROUND_NAMES[uclRoundPending]} · 对手：${uclOpponent}（${uclVenue}）`;
          } else {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠${UCL_ROUND_NAMES[uclRoundPending]}`;
          }
        } else if (cupRoundPending) {
          const cupMatches = cup.rounds[cupRoundPending].matches || [];
          const neutralRound = cupRoundPending === "semiFinals" || cupRoundPending === "final";
          let cupOpponent = null;
          let cupVenue = "";
          for (const m of cupMatches) {
            if (leagueTeams[m.homeIdx].isUser) {
              cupOpponent = m.awayName;
              cupVenue = neutralRound ? "中" : "主";
              break;
            } else if (leagueTeams[m.awayIdx].isUser) {
              cupOpponent = m.homeName;
              cupVenue = neutralRound ? "中" : "客";
              break;
            }
          }
          currentPosName.style.color = '#facc15';
          if (cupOpponent) {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 足总杯${CUP_ROUND_NAMES[cupRoundPending]} · 对手：${cupOpponent}（${cupVenue}）`;
          } else {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 足总杯${CUP_ROUND_NAMES[cupRoundPending]}`;
          }
        } else if (isFinished) {
          currentPosName.style.color = '';
          currentPosName.textContent = `${seasonLabel(currentSeason)}已结束`;
        } else {
          currentPosName.style.color = '';
          currentPosName.textContent = `${seasonLabel(currentSeason)} · 第 ${currentRound + 1} 轮 · 对手：${nextOpponent}（${nextVenue}）`;
        }
        progressText.textContent = `${seasonLabel(currentSeason)} · ${currentRound} / ${fixtures.length} 轮已完成`;
        refreshBtn.style.display = "none";
        refreshText.style.display = "none";

        if (currentRound >= half && !isFinished) {
          simHalfBtn.textContent = "模拟到结束";
        } else if (!isFinished) {
          simHalfBtn.textContent = "模拟至半程";
        }

        if (isFinished && hasAnyPending) {
          simNextBtn.textContent = "模拟一场";
          simNextBtn.classList.remove("hidden");
          simNextBtn.disabled = false;
          simHalfBtn.textContent = "模拟到结束";
          simHalfBtn.classList.remove("hidden");
          simHalfBtn.disabled = false;
          restartBtn.classList.add("hidden");
          nextSeasonBtn.classList.add("hidden");
          shareBtn.classList.add("hidden");
        } else if (isFinished) {
          simNextBtn.classList.add("hidden");
          simHalfBtn.classList.add("hidden");
          restartBtn.classList.remove("hidden");
          nextSeasonBtn.classList.remove("hidden");
          shareBtn.classList.remove("hidden");
        } else if (!isSimulating) {
          simNextBtn.textContent = "模拟一场";
          simNextBtn.classList.remove("hidden");
          simHalfBtn.classList.remove("hidden");
          restartBtn.classList.add("hidden");
          nextSeasonBtn.classList.add("hidden");
          shareBtn.classList.add("hidden");
          simNextBtn.disabled = false;
          simHalfBtn.disabled = false;
        }
      } else {
        // 查看历史/累计时隐藏所有按钮
        simNextBtn.classList.add("hidden");
        simHalfBtn.classList.add("hidden");
        restartBtn.classList.add("hidden");
        nextSeasonBtn.classList.add("hidden");
        shareBtn.classList.add("hidden");
        currentPosName.style.color = '';
        currentPosName.textContent = viewSeason === "cumulative" ? "累计统计" : `查看历史赛季`;
        progressText.textContent = "";
        refreshBtn.style.display = "none";
        refreshText.style.display = "none";
      }

      let contentHtml;

      if (isCurrent) {
        const sorted = [...standings].sort((a, b) =>
          b.points - a.points || b.gd - a.gd || b.gf - a.gf
        );
        let resultsHtml = "";
        if (lastSimType === "ucl" && lastUclResults) {
          if (lastUclResults.isLeaguePhase) {
            // 联赛阶段赛果 - 显示全部比赛
            resultsHtml = `<div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#60a5fa;">欧冠 ${lastUclResults.roundName} 赛果</div>
              ${[...lastUclResults.matches].sort((a, b) => (b.isUser ? 1 : 0) - (a.isUser ? 1 : 0)).map(m => {
                const homeIsUser = ucl.teams[m.homeIdx].isUser;
                const awayIsUser = ucl.teams[m.awayIdx].isUser;
                const homeName = ucl.teams[m.homeIdx].name;
                const awayName = ucl.teams[m.awayIdx].name;
                const scoreColor = getMatchScoreColor(m.isUser, m.userResult);
                return `<div style="margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                    <span style="text-align:right; flex:1; color:${homeIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${homeIsUser ? 700 : 400};">${homeName}</span>
                    <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700;">${m.homeGoals} - ${m.awayGoals}</span>
                    <span style="flex:1; color:${awayIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${awayIsUser ? 700 : 400};">${awayName}</span>
                  </div>
                  ${m.isUser ? formatMatchEvents(m.events, homeIsUser) : ""}
                </div>`;
              }).join("")}
            </div>`;
          } else if (lastUclResults.ties) {
            // 淘汰赛赛果
            const sortedTies = [...lastUclResults.ties].sort((a, b) => {
              const aUser = (a.teamAName === "我的球队" || a.teamBName === "我的球队") ? 1 : 0;
              const bUser = (b.teamAName === "我的球队" || b.teamBName === "我的球队") ? 1 : 0;
              return bUser - aUser;
            });
            resultsHtml = `<div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#60a5fa;">欧冠 ${lastUclResults.roundName} 赛果</div>
              ${sortedTies.map(tie => {
                const isUser = tie.teamAName === "我的球队" || tie.teamBName === "我的球队";
                const leg = lastUclResults.legNum === 1 ? tie.leg1 : tie.leg2;
                if (!leg) return "";
                const homeName = ucl.teams[leg.homeIdx].name;
                const awayName = ucl.teams[leg.awayIdx].name;
                const homeIsUser = ucl.teams[leg.homeIdx].isUser;
                const awayIsUser = ucl.teams[leg.awayIdx].isUser;
                // Leg2决定后：败者灰色，用户球队始终绿色
                const decided = lastUclResults.legNum === 2 && tie.winnerIdx !== null;
                let scoreColor = getMatchScoreColor(leg.isUser, leg.userResult);
                // Leg2用户比赛：比分颜色根据是否晋级决定，而非单场胜负
                // 注意Leg2中home=teamB, away=teamA，用leg.homeIdx/leg.awayIdx判断
                if (lastUclResults.legNum === 2 && leg.isUser && decided) {
                  const userAdvances = (homeIsUser && tie.winnerIdx === leg.homeIdx) || (awayIsUser && tie.winnerIdx === leg.awayIdx);
                  scoreColor = userAdvances ? '#34d399' : '#f87171';
                }
                const homeWon = decided && tie.winnerIdx === leg.homeIdx;
                const awayWon = decided && tie.winnerIdx === leg.awayIdx;
                const homeColor = homeIsUser ? '#34d399' : decided ? (homeWon ? '#e2e8f0' : '#64748b') : '#e2e8f0';
                const awayColor = awayIsUser ? '#34d399' : decided ? (awayWon ? '#e2e8f0' : '#64748b') : '#e2e8f0';
                let aggText = "";
                if (lastUclResults.legNum === 2 && tie.aggA !== null) {
                  // 次回合主场=teamB在左，客场=teamA在右，总比分跟随此顺序
                  const aggLeft = tie.aggB;
                  const aggRight = tie.aggA;
                  const penLeft = tie.penaltyAway;
                  const penRight = tie.penaltyHome;
                  aggText = `<div style="font-size:11px; color:#94a3b8; text-align:center;">总比分 ${aggLeft}-${aggRight}${tie.leg2 && tie.leg2.et ? ' (加时)' : ''}${penLeft !== undefined ? ` (点${penLeft}-${penRight})` : ''} ${tie.winnerIdx === tie.teamAIdx ? tie.teamAName : tie.teamBName}晋级</div>`;
                }
                return `<div style="margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                    <span style="text-align:right; flex:1; color:${homeColor}; font-weight:${homeIsUser ? 700 : 400};">${homeName}</span>
                    <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700;">${leg.homeGoals} - ${leg.awayGoals}${leg.et ? '<span style="font-size:11px;"> (加时)</span>' : ''}${lastUclResults.legNum === 2 && tie.penaltyHome !== undefined ? `<span style="font-size:11px;"> (点${tie.penaltyAway}-${tie.penaltyHome})</span>` : ''}</span>
                    <span style="flex:1; color:${awayColor}; font-weight:${awayIsUser ? 700 : 400};">${awayName}</span>
                  </div>
                  ${leg.isUser ? formatMatchEvents(leg.events, homeIsUser) : ""}
                  ${aggText}
                </div>`;
              }).join("")}
            </div>`;
          } else if (lastUclResults.match) {
            // 决赛赛果
            const fm = lastUclResults.match;
            const homeIsUser = ucl.teams[fm.homeIdx].isUser;
            const awayIsUser = ucl.teams[fm.awayIdx].isUser;
            let scoreColor = "#e2e8f0";
            if (fm.isUser) {
              const userWon = fm.winnerIdx === (homeIsUser ? fm.homeIdx : fm.awayIdx);
              scoreColor = userWon ? "#34d399" : "#f87171";
            }
            let sc = `${fm.homeGoals} - ${fm.awayGoals}`;
            if (fm.et) sc += ' (加时)';
            if (fm.penaltyHome !== undefined) sc += ` (点${fm.penaltyHome}-${fm.penaltyAway})`;
            resultsHtml = `<div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#60a5fa;">欧冠决赛 赛果</div>
              <div style="margin-bottom:10px;">
                <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                  <span style="text-align:right; flex:1; color:${homeIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${homeIsUser ? 700 : 400};">${fm.homeName}</span>
                  <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700;">${sc}</span>
                  <span style="flex:1; color:${awayIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${awayIsUser ? 700 : 400};">${fm.awayName}</span>
                </div>
                ${fm.isUser ? formatMatchEvents(fm.events, homeIsUser) : ""}
              </div>
              <div style="text-align:center; color:#60a5fa; font-weight:700;">冠军：${ucl.champion}</div>
            </div>`;
          }
        } else if (lastSimType === "cup" && lastCupResults) {
          // 杯赛赛果展示
          resultsHtml = `
            <div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#facc15;">足总杯 ${lastCupResults.roundName} 赛果</div>
              ${[...lastCupResults.matches].sort((a, b) => (b.isUser ? 1 : 0) - (a.isUser ? 1 : 0)).map(m => {
                const homeIsUser = m.homeName === "我的球队";
                const awayIsUser = m.awayName === "我的球队";
                const homeWon = m.winnerIdx === m.homeIdx;
                const awayWon = m.winnerIdx === m.awayIdx;
                const userWon = m.isUser && m.winnerIdx === (homeIsUser ? m.homeIdx : m.awayIdx);
                const scoreColor = m.isUser ? (userWon ? "#34d399" : "#f87171") : "#e2e8f0";
                const penaltyColor = !m.isUser ? "#94a3b8" : userWon ? "#34d399" : "#f87171";
                const scoreText = m.penaltyHome !== undefined
                  ? `${m.homeGoals} - ${m.awayGoals}<span style="font-size:11px; color:${penaltyColor};"> (点${m.penaltyHome}-${m.penaltyAway})</span>`
                  : `${m.homeGoals} - ${m.awayGoals}`;
                return `
                <div style="margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                    <span style="text-align:right; flex:1; color:${homeIsUser ? '#34d399' : homeWon ? '#e2e8f0' : '#64748b'}; font-weight:${homeIsUser ? 700 : 400};">${m.homeName}</span>
                    <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700; white-space:nowrap;">${scoreText}</span>
                    <span style="flex:1; color:${awayIsUser ? '#34d399' : awayWon ? '#e2e8f0' : '#64748b'}; font-weight:${awayIsUser ? 700 : 400};">${m.awayName}</span>
                  </div>
                  ${m.isUser ? formatMatchEvents(m.events, homeIsUser) : ""}
                </div>`;
              }).join("")}
            </div>`;
        } else if (lastSimType === "league" && lastRoundResults.length > 0) {
          resultsHtml = `
            <div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#34d399;">第 ${currentRound} 轮赛果</div>
              ${lastRoundResults.map(r => {
                const scoreColor = getMatchScoreColor(r.isUser, r.userResult);
                const userIsHome = r.homeName === "我的球队";
                return `
                <div style="margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                    <span style="text-align:right; flex:1; color:${r.isUser && userIsHome ? '#34d399' : '#e2e8f0'}; font-weight:${r.isUser && userIsHome ? 700 : 400};">${r.homeName}</span>
                    <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700;">${r.homeGoals} - ${r.awayGoals}</span>
                    <span style="flex:1; color:${r.isUser && !userIsHome ? '#34d399' : '#e2e8f0'}; font-weight:${r.isUser && !userIsHome ? 700 : 400};">${r.awayName}</span>
                  </div>
                  ${r.isUser ? formatMatchEvents(r.events, userIsHome) : ""}
                </div>`;
              }).join("")}
            </div>`;
        }
        if (cupRoundPending && cup.rounds[cupRoundPending].matches.length > 0) {
          // 同时展示下一场杯赛对阵
          const pendingMatches = cup.rounds[cupRoundPending].matches;
          resultsHtml += `
            <div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#facc15;">足总杯 ${CUP_ROUND_NAMES[cupRoundPending]} 对阵</div>
              ${pendingMatches.map(m => {
                const homeIsUser = m.homeName === "我的球队";
                const awayIsUser = m.awayName === "我的球队";
                return `
                <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                  <span style="text-align:right; flex:1; color:${homeIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${homeIsUser ? 700 : 400};">${m.homeName}</span>
                  <span style="flex:0 0 auto; padding:0 10px; color:#64748b; font-weight:700; white-space:nowrap;">vs</span>
                  <span style="flex:1; color:${awayIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${awayIsUser ? 700 : 400};">${m.awayName}</span>
                </div>`;
              }).join("")}
            </div>`;
        }
        const cupHtml = buildCupBracketHtml(cup);
        const uclStandingsHtml = buildUclStandingsHtml();
        const uclBracketHtml = buildUclBracketHtml(ucl);
        const awardsHtml = seasonAwards ? buildAwardsHtml(seasonAwards) : "";
        contentHtml = `
          <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
            <div style="flex:0 0 240px; margin:0 auto;">
              ${resultsHtml || '<div class="empty-state">尚无赛果</div>'}
            </div>
            <div style="flex:1; min-width:280px;">
              ${buildStandingsTableHtml(sorted)}
            </div>
          </div>
          ${cupHtml}
          ${uclStandingsHtml}
          ${uclBracketHtml}
          ${awardsHtml}
          ${buildPlayerStatsHtml(null, { showFilter: true })}`;
      } else if (viewSeason === "cumulative") {
        contentHtml = `<div class="empty-state" style="text-align:left; padding:0;">累计统计涵盖所有已完成赛季的数据</div>` + buildPlayerStatsHtml(buildCumulativeStats(), { showAge: false, showFilter: true });
      } else {
        const hist = seasonHistory.find(s => s.seasonNum == viewSeason);
        if (hist) {
          const sorted = [...hist.standings].sort((a, b) =>
            b.points - a.points || b.gd - a.gd || b.gf - a.gf
          );
          const histCupHtml = hist.cup ? buildCupBracketHtml(hist.cup) : '';
          const histUclHtml = hist.ucl ? buildUclBracketHtml(hist.ucl) : '';
          const histAwardsHtml = hist.awards ? buildAwardsHtml(hist.awards) : '';
          contentHtml = `
            <div style="flex:1; min-width:280px;">
              ${buildStandingsTableHtml(sorted)}
            </div>
            ${histCupHtml}
            ${histUclHtml}
            ${histAwardsHtml}
            ${buildPlayerStatsHtml(hist.stats, { showFilter: true })}`;
        } else {
          contentHtml = '<div class="empty-state">无数据</div>';
        }
      }

      candidateList.innerHTML = `<div>${seasonSelector}${contentHtml}</div>`;

      const seasonSelect = document.getElementById("seasonSelect");
      if (seasonSelect) {
        seasonSelect.addEventListener("change", (e) => {
          viewSeason = e.target.value;
          renderLeague();
        });
      }

      const playerStatsFilterSelect = document.getElementById("playerStatsFilterSelect");
      if (playerStatsFilterSelect) {
        playerStatsFilterSelect.addEventListener("change", (e) => {
          playerStatsFilter = e.target.value;
          renderLeague();
        });
      }
    }

    // 版本号（基于页面更新时间）
    (function() {
      const d = new Date(document.lastModified);
      const pad = n => String(n).padStart(2, '0');
      const ts = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      document.getElementById('versionFooter').textContent = `版本 ${ts}`;
    })();
  </script>
</body>
</html>
