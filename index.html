    function simulateRound(roundIdx) {
      const round = fixtures[roundIdx];
      lastRoundResults = [];

      for (const match of round) {
        const home = leagueTeams[match.home];
        const away = leagueTeams[match.away];
        const result = simulateMatch(home.strength, away.strength);

        let events = [];
        let userResult = null;
        if (home.isUser) {
          events = generateUserMatchEvents(result.homeGoals, result.awayGoals, "league", away.name, away.roster);
          userResult = result.homeGoals > result.awayGoals ? "win" : result.homeGoals < result.awayGoals ? "loss" : "draw";
        } else if (away.isUser) {
          events = generateUserMatchEvents(result.awayGoals, result.homeGoals, "league", home.name, home.roster);
          userResult = result.awayGoals > result.homeGoals ? "win" : result.awayGoals < result.homeGoals ? "loss" : "draw";
        } else {
          events = generateOppMatchEvents(result.homeGoals, result.awayGoals, home.name, away.name, home.roster, away.roster);
        }

        lastRoundResults.push({
          homeName: home.name,
          awayName: away.name,
          homeGoals: result.homeGoals,
          awayGoals: result.awayGoals,
          isUser: home.isUser || away.isUser,
          userResult,
          events
        });

        const h = standings[match.home];
        const a = standings[match.away];

        h.played++; a.played++;
        h.gf += result.homeGoals; h.ga += result.awayGoals;
        a.gf += result.awayGoals; a.ga += result.homeGoals;

        if (result.homeGoals > result.awayGoals) {
          h.won++; a.lost++;
          h.points += 3;
        } else if (result.homeGoals < result.awayGoals) {
          h.lost++; a.won++;
          a.points += 3;
        } else {
          h.drawn++; a.drawn++;
          h.points++; a.points++;
        }
      }

      for (const s of standings) {
        s.gd = s.gf - s.ga;
      }
    }

    function drawCupRoundMatches(roundKey) {
      const round = cup.rounds[roundKey];
      const teams = round.teams;
      const shuffled = [...teams].sort(() => Math.random() - 0.5);
      const matches = [];
      for (let i = 0; i < shuffled.length; i += 2) {
        const homeIdx = shuffled[i];
        const awayIdx = shuffled[i + 1];
        matches.push({
          homeIdx, awayIdx,
          homeName: leagueTeams[homeIdx].name,
          awayName: leagueTeams[awayIdx].name
        });
      }
      round.matches = matches;
    }

    function simulateCupRound(roundKey) {
      const round = cup.rounds[roundKey];

      // 使用预抽签的对阵，如果没有则当场抽签
      let matches = round.matches && round.matches.length > 0 ? round.matches : [];
      if (matches.length === 0) {
        const teams = round.teams;
        const shuffled = [...teams].sort(() => Math.random() - 0.5);
        for (let i = 0; i < shuffled.length; i += 2) {
          const homeIdx = shuffled[i];
          const awayIdx = shuffled[i + 1];
          matches.push({
            homeIdx, awayIdx,
            homeName: leagueTeams[homeIdx].name,
            awayName: leagueTeams[awayIdx].name
          });
        }
      }

      const neutralVenue = roundKey === "semiFinals" || roundKey === "final";
      for (const m of matches) {
        const result = simulateMatch(leagueTeams[m.homeIdx].strength, leagueTeams[m.awayIdx].strength, neutralVenue);
        m.homeGoals = result.homeGoals;
        m.awayGoals = result.awayGoals;
        let penaltyHome, penaltyAway;
        if (result.homeGoals !== result.awayGoals) {
          m.winnerIdx = result.homeGoals > result.awayGoals ? m.homeIdx : m.awayIdx;
        } else {
          const penResult = penaltyShootout(m.homeIdx, m.awayIdx);
          m.winnerIdx = penResult.winnerIdx;
          penaltyHome = penResult.homePenalty;
          penaltyAway = penResult.awayPenalty;
        }
        if (penaltyHome !== undefined) {
          m.penaltyHome = penaltyHome;
          m.penaltyAway = penaltyAway;
        }
        m.winnerName = leagueTeams[m.winnerIdx].name;
        // 用户球队参赛时分配数据并生成事件
        if (leagueTeams[m.homeIdx].isUser || leagueTeams[m.awayIdx].isUser) {
          const userIsHome = leagueTeams[m.homeIdx].isUser;
          const userGoals = userIsHome ? result.homeGoals : result.awayGoals;
          const oppGoals = userIsHome ? result.awayGoals : result.homeGoals;
          const oppName = userIsHome ? m.awayName : m.homeName;
          const oppRoster = userIsHome ? leagueTeams[m.awayIdx].roster : leagueTeams[m.homeIdx].roster;
          m.events = generateUserMatchEvents(userGoals, oppGoals, "cup", oppName, oppRoster);
          m.isUser = true;
          m.userResult = userGoals > oppGoals ? "win" : userGoals < oppGoals ? "loss" : "draw";
        } else {
          m.events = generateOppMatchEvents(result.homeGoals, result.awayGoals, m.homeName, m.awayName, leagueTeams[m.homeIdx].roster, leagueTeams[m.awayIdx].roster);
          m.isUser = false;
          m.userResult = null;
        }
      }

      round.matches = matches;
      round.done = true;

      // 推进胜者到下一轮，并立即抽签更新对阵图
      const nextKey = getNextCupRound(roundKey);
      if (nextKey) {
        cup.rounds[nextKey].teams = matches.map(m => m.winnerIdx);
        drawCupRoundMatches(nextKey);
      }

      // 决赛产生冠军
      if (roundKey === "final") {
        cup.champion = leagueTeams[matches[0].winnerIdx].name;
      }
    }

    function buildPlayerStatsHtml(stats = null, opts = {}) {
      const { showAge = true, hideReplaced = false, filter = playerStatsFilter, showFilter = false, clickable = false } = opts;
      const data = stats || userPlayerStats;
      if (data.length === 0 && !clickable) return "";
      const getName = s => s.player ? s.player.name : s.playerName;
      const getOvr = s => s.player ? s.player.ovr : s.playerOvr;
      const getAge = s => s.player ? s.player.age : s.playerAge;

      const filterLabels = { all: "全部", league: "联赛", cup: "足总杯", ucl: "欧冠" };
      const activeFilter = filterLabels[filter] ? filter : "all";

      const getStat = (s, baseKey) => {
        if (activeFilter === "all") return s[baseKey];
        const key = `${activeFilter}${baseKey.charAt(0).toUpperCase() + baseKey.slice(1)}`;
        return s[key] || 0;
      };

      let displayStats = data.filter(s => getStat(s, "appearances") > 0);
      if (hideReplaced) displayStats = displayStats.filter(s => !s.replaced);

      // 移动端转会模式：补齐 11 个位置行，并附加位置索引用于弹窗选人
      if (clickable && selectedFormation) {
        const slots = formations[selectedFormation];
        const covered = new Set();
        displayStats = displayStats.map(s => {
          const idx = data.indexOf(s);
          let posIndex = -1;
          if (idx >= 0 && idx < 11) posIndex = idx;
          else if (s.player) posIndex = draftPicks.findIndex(p => p && p.id === s.player.id);
          if (posIndex >= 0) covered.add(posIndex);
          return { ...s, _posIndex: posIndex };
        });
        for (let i = 0; i < slots.length; i++) {
          if (!covered.has(i)) {
            displayStats.push({
              _isEmptySlot: true,
              _posIndex: i,
              pos: slots[i].pos,
              player: null,
              appearances: 0, goals: 0, assists: 0, cleanSheets: 0,
              leagueAppearances: 0, leagueGoals: 0, leagueAssists: 0, leagueCleanSheets: 0,
              cupAppearances: 0, cupGoals: 0, cupAssists: 0, cupCleanSheets: 0,
              uclAppearances: 0, uclGoals: 0, uclAssists: 0, uclCleanSheets: 0
            });
          }
        }
        displayStats.sort((a, b) => (a._posIndex - b._posIndex));
      }

      if (displayStats.length === 0) return "";

      const filterHtml = showFilter
        ? `<div style="margin-bottom:10px;">
            <select id="playerStatsFilterSelect" style="background:#1e293b; color:#e2e8f0; border:1px solid #475569; border-radius:6px; padding:5px 8px; font-size:13px;">
              <option value="all" ${activeFilter === "all" ? 'selected' : ''}>全部</option>
              <option value="league" ${activeFilter === "league" ? 'selected' : ''}>联赛</option>
              <option value="cup" ${activeFilter === "cup" ? 'selected' : ''}>足总杯</option>
              <option value="ucl" ${activeFilter === "ucl" ? 'selected' : ''}>欧冠</option>
            </select>
          </div>`
        : "";

      const colCount = showAge ? 7 : 6;

      return `
        <div style="margin-top:20px;">
          <div style="margin-bottom:12px; font-weight:700; color:#34d399;">个人数据</div>
          ${filterHtml}
          <table class="player-stats-table ${clickable ? 'transfer-clickable' : ''}" style="width:100%; border-collapse:collapse; font-size:13px;">
            <thead>
              <tr style="color:#94a3b8; border-bottom:2px solid #475569;">
                <th style="text-align:left; padding:6px 4px;">位置</th>
                <th style="text-align:left; padding:6px 4px;">球员</th>
                ${showAge ? `<th style="text-align:center; padding:6px 4px;">年龄</th>` : ''}
                <th style="text-align:center; padding:6px 4px;">上场</th>
                <th style="text-align:center; padding:6px 4px;">进球</th>
                <th style="text-align:center; padding:6px 4px;">助攻</th>
                <th style="text-align:center; padding:6px 4px;">零封</th>
              </tr>
            </thead>
            <tbody>
              ${displayStats.map(s => {
                const idx = s._posIndex;
                const isEmpty = s._isEmptySlot;
                const dataAttr = clickable && idx !== undefined && idx >= 0 ? `data-index="${idx}"` : '';
                if (isEmpty) {
                  return `<tr ${dataAttr} style="border-bottom:1px solid #334155;">
                    <td colspan="${colCount}" class="transfer-empty-slot">[已离队] 点击选择新球员</td>
                  </tr>`;
                }
                return `<tr ${dataAttr} style="border-bottom:1px solid #334155; color:${s.replaced ? '#64748b' : s.isTransfer ? '#facc15' : '#e2e8f0'}; ${s.replaced ? 'opacity:0.6;' : ''}">
                  <td style="padding:6px 4px; color:#94a3b8;">${s.pos}</td>
                  <td style="padding:6px 4px; font-weight:700;">${s.isTransfer ? '[换] ' : ''}${getName(s)}${tianyanMode ? `<span class="ovr-badge" style="margin-left:6px; padding:2px 6px; font-size:11px;">${getOvr(s)}</span>` : ''}</td>
                  ${showAge ? `<td style="text-align:center; padding:6px 4px; color:#94a3b8;">${getAge(s)}</td>` : ''}
                  <td style="text-align:center; padding:6px 4px;">${getStat(s, "appearances")}</td>
                  <td style="text-align:center; padding:6px 4px;">${getStat(s, "goals")}</td>
                  <td style="text-align:center; padding:6px 4px;">${getStat(s, "assists")}</td>
                  <td style="text-align:center; padding:6px 4px;">${cleanSheetPositions.includes(s.pos) ? getStat(s, "cleanSheets") : '-'}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>`;

    function buildCumulativeStats() {
      const getName = s => s.player ? s.player.name : s.playerName;
      const getOvr = s => s.player ? s.player.ovr : s.playerOvr;
      const getAge = s => s.player ? s.player.age : s.playerAge;
      const getId = s => s.player ? s.player.id : s.playerId;
      const map = new Map();
      const allStats = [...seasonHistory.map(h => h.stats), userPlayerStats];
      for (const stats of allStats) {
        for (const s of stats) {
          if (s.appearances === 0) continue;
          const id = getId(s);
          if (!map.has(id)) {
            map.set(id, {
              pos: s.pos, goals: 0, assists: 0, cleanSheets: 0, appearances: 0,
              leagueGoals: 0, leagueAssists: 0, leagueCleanSheets: 0, leagueAppearances: 0,
              cupGoals: 0, cupAssists: 0, cupCleanSheets: 0, cupAppearances: 0,
              uclGoals: 0, uclAssists: 0, uclCleanSheets: 0, uclAppearances: 0,
              replaced: false, isTransfer: false,
              playerName: getName(s), playerOvr: getOvr(s), playerAge: getAge(s)
            });
          }
          const e = map.get(id);
          e.goals += s.goals; e.assists += s.assists;
          e.cleanSheets += s.cleanSheets; e.appearances += s.appearances;
          e.leagueGoals += s.leagueGoals || 0; e.leagueAssists += s.leagueAssists || 0;
          e.leagueCleanSheets += s.leagueCleanSheets || 0; e.leagueAppearances += s.leagueAppearances || 0;
          e.cupGoals += s.cupGoals || 0; e.cupAssists += s.cupAssists || 0;
          e.cupCleanSheets += s.cupCleanSheets || 0; e.cupAppearances += s.cupAppearances || 0;
          e.uclGoals += s.uclGoals || 0; e.uclAssists += s.uclAssists || 0;
          e.uclCleanSheets += s.uclCleanSheets || 0; e.uclAppearances += s.uclAppearances || 0;
        }
      }
      return Array.from(map.values());
    }

    function buildStandingsTableHtml(sorted) {
      return `

        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr style="color:#94a3b8; border-bottom:2px solid #475569;">
              <th style="text-align:left; padding:6px 4px;">排名</th>
              <th style="text-align:left; padding:6px 4px;">球队</th>
              <th style="text-align:center; padding:6px 4px;">赛</th>
              <th style="text-align:center; padding:6px 4px;">胜</th>
              <th style="text-align:center; padding:6px 4px;">平</th>
              <th style="text-align:center; padding:6px 4px;">负</th>
              <th style="text-align:center; padding:6px 4px;">进</th>
              <th style="text-align:center; padding:6px 4px;">失</th>
              <th style="text-align:center; padding:6px 4px;">净</th>
              <th style="text-align:center; padding:6px 4px;">分</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.map((s, i) => {
              const rank = i + 1;
              const rankColor = rank <= 4 ? '#60a5fa' : (s.isUser ? '#34d399' : '#e2e8f0');
              return `
              <tr style="border-bottom:1px solid #334155; color:${s.isUser ? '#34d399' : '#e2e8f0'}; font-weight:${s.isUser ? 700 : 400};">
                <td style="padding:6px 4px; color:${rankColor}; font-weight:700;">${rank}</td>
                <td style="padding:6px 4px;">${s.name}</td>
                <td style="text-align:center; padding:6px 4px;">${s.played}</td>
                <td style="text-align:center; padding:6px 4px;">${s.won}</td>
                <td style="text-align:center; padding:6px 4px;">${s.drawn}</td>
                <td style="text-align:center; padding:6px 4px;">${s.lost}</td>
                <td style="text-align:center; padding:6px 4px;">${s.gf}</td>
                <td style="text-align:center; padding:6px 4px;">${s.ga}</td>
                <td style="text-align:center; padding:6px 4px;">${s.gd > 0 ? '+' : ''}${s.gd}</td>
                <td style="text-align:center; padding:6px 4px;">${s.points}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
        <div style="font-size:11px; color:#94a3b8; margin-top:4px;">
          <span style="color:#60a5fa;">■</span> 1-4 欧冠资格
        </div>`;
    }

    function buildCupBracketHtml(cupData) {
      if (!cupData) return '';
      const rounds = cupData.rounds;
      // 如果杯赛尚无任何比赛，不显示
      const hasAnyData = CUP_ROUND_ORDER_ALL.some(k => {
        const r = rounds[k];
        return r && ((r.done && r.matches.length > 0) || (r.teams && r.teams.length > 0));
      });
      if (!hasAnyData && !cupData.champion) return '';
      let html = `<div style="margin-top:20px;">
        <div style="margin-bottom:12px; font-weight:700; color:#facc15;">足总杯</div>`;

      for (const key of CUP_ROUND_ORDER_ALL) {
        const round = rounds[key];
        if (!round) continue;
        const name = CUP_ROUND_NAMES[key];
        if (round.matches && round.matches.length > 0) {
          html += `<div style="background:#0f172a; border-radius:8px; padding:10px 14px; margin-bottom:8px;">
            <div style="font-weight:700; font-size:13px; color:#facc15; margin-bottom:6px;">${name}</div>`;
          for (const m of round.matches) {
            const homeName = m.homeName || `球队${m.homeIdx}`;
            const awayName = m.awayName || `球队${m.awayIdx}`;
            const homeIsUser = homeName === "我的球队";
            const awayIsUser = awayName === "我的球队";
            const isDone = m.homeGoals !== undefined;
            const homeWon = isDone && m.winnerIdx === m.homeIdx;
            const awayWon = isDone && m.winnerIdx === m.awayIdx;
            const homeColor = homeIsUser ? '#34d399' : homeWon ? '#e2e8f0' : '#64748b';
            const awayColor = awayIsUser ? '#34d399' : awayWon ? '#e2e8f0' : '#64748b';
            let centerText;
            if (isDone) {
              centerText = m.penaltyHome !== undefined
                ? `${m.homeGoals} - ${m.awayGoals}<span style="font-size:10px; color:#94a3b8;"> (点${m.penaltyHome}-${m.penaltyAway})</span>`
                : `${m.homeGoals} - ${m.awayGoals}`;
            } else {
              centerText = `<span style="color:#64748b;">vs</span>`;
            }
            html += `<div style="display:flex; justify-content:space-between; font-size:12px; padding:3px 0;">
              <span style="color:${homeColor}; font-weight:${homeIsUser ? 700 : 400}; flex:1; text-align:right;">${homeName}</span>
              <span style="flex:0 0 auto; padding:0 8px; color:#facc15; font-weight:700; white-space:nowrap;">${centerText}</span>
              <span style="color:${awayColor}; font-weight:${awayIsUser ? 700 : 400}; flex:1;">${awayName}</span>
            </div>`;
          }
          html += `</div>`;
        } else if (round.teams && round.teams.length > 0) {
          html += `<div style="background:#0f172a; border-radius:8px; padding:10px 14px; margin-bottom:8px;">
            <div style="font-weight:700; font-size:13px; color:#facc15; margin-bottom:6px;">${name}</div>
            <div style="font-size:12px; color:#64748b;">待定</div>
          </div>`;
        }
      }

      if (cupData.champion) {
        const isUserChampion = cupData.champion === "我的球队";
        html += `<div style="text-align:center; padding:12px; background:#0f172a; border-radius:8px; border:2px solid ${isUserChampion ? '#facc15' : '#334155'};">
          <div style="font-size:14px; color:${isUserChampion ? '#facc15' : '#e2e8f0'}; font-weight:700;">
            冠军：${cupData.champion}${isUserChampion ? ' (我)' : ''}
          </div>
        </div>`;
      }

      html += `</div>`;
      return html;
    }

    function renderLeague() {
      const isFinished = currentRound >= fixtures.length;
      const half = Math.floor(fixtures.length / 2);
      const isCurrent = viewSeason === "current";

      // 赛季选择器
      const seasonOptions = [
        `<option value="current" ${isCurrent ? 'selected' : ''}>${seasonLabel(currentSeason)}（当前）</option>`,
        ...seasonHistory.map(s => `<option value="${s.seasonNum}" ${viewSeason == String(s.seasonNum) ? 'selected' : ''}>${seasonLabel(s.seasonNum)}</option>`),
        `<option value="cumulative" ${viewSeason === 'cumulative' ? 'selected' : ''}>累计统计</option>`
      ].join('');
      const seasonSelector = seasonHistory.length > 0
        ? `<div style="margin-bottom:16px;"><select id="seasonSelect" style="background:#1e293b; color:#e2e8f0; border:1px solid #475569; border-radius:6px; padding:6px 10px; font-size:14px;">${seasonOptions}</select></div>`
        : '';

      if (isCurrent) {
        // 找到用户下一轮的对手
        let nextOpponent = null;
        let nextVenue = "";
        if (!isFinished) {
          const round = fixtures[currentRound];
          for (const m of round) {
            if (leagueTeams[m.home].isUser) {
              nextOpponent = leagueTeams[m.away].name;
              nextVenue = "主";
              break;
            } else if (leagueTeams[m.away].isUser) {
              nextOpponent = leagueTeams[m.home].name;
              nextVenue = "客";
              break;
            }
          }
        }

        // 联赛结束后检查欧冠决赛（杯赛决赛已在赛程中处理）
        if (isFinished && ucl && ucl.active && ucl.knockout.sf.done && !uclFinalPending && !ucl.knockout.final.done && cup && cup.rounds.final.done) {
          uclFinalPending = true;
        }

        const hasAnyPending = cupFinalPending || uclSfPending || uclFinalPending || uclRoundPending || cupRoundPending;

        if (uclFinalPending) {
          currentPosName.style.color = '#60a5fa';
          currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠决赛`;
        } else if (isFinished && cupFinalPending) {
          const cupMatches = cup.rounds.final.matches || [];
          let cupOpponent = null;
          let cupVenue = "";
          for (const m of cupMatches) {
            if (leagueTeams[m.homeIdx].isUser) {
              cupOpponent = m.awayName;
              cupVenue = "中";
              break;
            } else if (leagueTeams[m.awayIdx].isUser) {
              cupOpponent = m.homeName;
              cupVenue = "中";
              break;
            }
          }
          currentPosName.style.color = '#facc15';
          if (cupOpponent) {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 足总杯决赛 · 对手：${cupOpponent}（${cupVenue}）`;
          } else {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 足总杯决赛`;
          }
        } else if (uclSfPending) {
          const sfRound = ucl.knockout.sf;
          const hasLeg1 = sfRound.ties.length > 0 && sfRound.ties[0].leg1;
          const legText = hasLeg1 ? "次回合" : "首回合";
          // 查找用户的对手
          let sfOpponent = null;
          for (const tie of sfRound.ties) {
            if (ucl.teams[tie.teamAIdx].isUser) { sfOpponent = ucl.teams[tie.teamBIdx].name; break; }
            if (ucl.teams[tie.teamBIdx].isUser) { sfOpponent = ucl.teams[tie.teamAIdx].name; break; }
          }
          currentPosName.style.color = '#60a5fa';
          if (sfOpponent) {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠半决赛${legText} · 对手：${sfOpponent}`;
          } else {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠半决赛${legText}`;
          }
        } else if (uclRoundPending) {
          const uclKey = uclRoundPending;
          let uclOpponent = null;
          let uclVenue = "";
          if (uclKey.startsWith("md")) {
            const mdIdx = parseInt(uclKey.substring(2)) - 1;
            const matchday = ucl.leagueFixtures[mdIdx];
            if (matchday) {
              for (const m of matchday) {
                if (ucl.teams[m.homeIdx].isUser) { uclOpponent = ucl.teams[m.awayIdx].name; uclVenue = "主"; break; }
                if (ucl.teams[m.awayIdx].isUser) { uclOpponent = ucl.teams[m.homeIdx].name; uclVenue = "客"; break; }
              }
            }
          } else {
            // knockout: playoffLeg1, r16Leg2, qfLeg1, sfLeg2 etc.
            let baseKey = uclKey;
            const isLeg1 = uclKey.endsWith("Leg1");
            const isLeg2 = uclKey.endsWith("Leg2");
            if (isLeg1) baseKey = uclKey.replace("Leg1", "");
            else if (isLeg2) baseKey = uclKey.replace("Leg2", "");
            const round = ucl.knockout[baseKey];
            if (round && round.ties) {
              for (const tie of round.ties) {
                if (ucl.teams[tie.teamAIdx].isUser) {
                  uclOpponent = ucl.teams[tie.teamBIdx].name;
                  uclVenue = isLeg1 ? "主" : "客";
                  break;
                }
                if (ucl.teams[tie.teamBIdx].isUser) {
                  uclOpponent = ucl.teams[tie.teamAIdx].name;
                  uclVenue = isLeg1 ? "客" : "主";
                  break;
                }
              }
            }
          }
          currentPosName.style.color = '#60a5fa';
          if (uclOpponent) {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠${UCL_ROUND_NAMES[uclRoundPending]} · 对手：${uclOpponent}（${uclVenue}）`;
          } else {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 欧冠${UCL_ROUND_NAMES[uclRoundPending]}`;
          }
        } else if (cupRoundPending) {
          const cupMatches = cup.rounds[cupRoundPending].matches || [];
          const neutralRound = cupRoundPending === "semiFinals" || cupRoundPending === "final";
          let cupOpponent = null;
          let cupVenue = "";
          for (const m of cupMatches) {
            if (leagueTeams[m.homeIdx].isUser) {
              cupOpponent = m.awayName;
              cupVenue = neutralRound ? "中" : "主";
              break;
            } else if (leagueTeams[m.awayIdx].isUser) {
              cupOpponent = m.homeName;
              cupVenue = neutralRound ? "中" : "客";
              break;
            }
          }
          currentPosName.style.color = '#facc15';
          if (cupOpponent) {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 足总杯${CUP_ROUND_NAMES[cupRoundPending]} · 对手：${cupOpponent}（${cupVenue}）`;
          } else {
            currentPosName.textContent = `${seasonLabel(currentSeason)} · 足总杯${CUP_ROUND_NAMES[cupRoundPending]}`;
          }
        } else if (isFinished) {
          currentPosName.style.color = '';
          currentPosName.textContent = `${seasonLabel(currentSeason)}已结束`;
        } else {
          currentPosName.style.color = '';
          currentPosName.textContent = `${seasonLabel(currentSeason)} · 第 ${currentRound + 1} 轮 · 对手：${nextOpponent}（${nextVenue}）`;
        }
        progressText.textContent = `${seasonLabel(currentSeason)} · ${currentRound} / ${fixtures.length} 轮已完成`;
        refreshBtn.style.display = "none";
        refreshText.style.display = "none";

        if (currentRound >= half && !isFinished) {
          simHalfBtn.textContent = "模拟到结束";
        } else if (!isFinished) {
          simHalfBtn.textContent = "模拟至半程";
        }

        if (isFinished && hasAnyPending) {
          simNextBtn.textContent = "模拟一场";
          simNextBtn.classList.remove("hidden");
          simNextBtn.disabled = false;
          simHalfBtn.textContent = "模拟到结束";
          simHalfBtn.classList.remove("hidden");
          simHalfBtn.disabled = false;
          restartBtn.classList.add("hidden");
          nextSeasonBtn.classList.add("hidden");
          shareBtn.classList.add("hidden");
        } else if (isFinished) {
          simNextBtn.classList.add("hidden");
          simHalfBtn.classList.add("hidden");
          restartBtn.classList.remove("hidden");
          nextSeasonBtn.classList.remove("hidden");
          shareBtn.classList.remove("hidden");
        } else if (!isSimulating) {
          simNextBtn.textContent = "模拟一场";
          simNextBtn.classList.remove("hidden");
          simHalfBtn.classList.remove("hidden");
          restartBtn.classList.add("hidden");
          nextSeasonBtn.classList.add("hidden");
          shareBtn.classList.add("hidden");
          simNextBtn.disabled = false;
          simHalfBtn.disabled = false;
        }
      } else {
        // 查看历史/累计时隐藏所有按钮
        simNextBtn.classList.add("hidden");
        simHalfBtn.classList.add("hidden");
        restartBtn.classList.add("hidden");
        nextSeasonBtn.classList.add("hidden");
        shareBtn.classList.add("hidden");
        currentPosName.style.color = '';
        currentPosName.textContent = viewSeason === "cumulative" ? "累计统计" : `查看历史赛季`;
        progressText.textContent = "";
        refreshBtn.style.display = "none";
        refreshText.style.display = "none";
      }

      let contentHtml;

      if (isCurrent) {
        const sorted = [...standings].sort((a, b) =>
          b.points - a.points || b.gd - a.gd || b.gf - a.gf
        );
        let resultsHtml = "";
        if (lastSimType === "ucl" && lastUclResults) {
          if (lastUclResults.isLeaguePhase) {
            // 联赛阶段赛果 - 显示全部比赛
            resultsHtml = `<div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#60a5fa;">欧冠 ${lastUclResults.roundName} 赛果</div>
              ${[...lastUclResults.matches].sort((a, b) => (b.isUser ? 1 : 0) - (a.isUser ? 1 : 0)).map(m => {
                const homeIsUser = ucl.teams[m.homeIdx].isUser;
                const awayIsUser = ucl.teams[m.awayIdx].isUser;
                const homeName = ucl.teams[m.homeIdx].name;
                const awayName = ucl.teams[m.awayIdx].name;
                const scoreColor = getMatchScoreColor(m.isUser, m.userResult);
                return `<div style="margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                    <span style="text-align:right; flex:1; color:${homeIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${homeIsUser ? 700 : 400};">${homeName}</span>
                    <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700;">${m.homeGoals} - ${m.awayGoals}</span>
                    <span style="flex:1; color:${awayIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${awayIsUser ? 700 : 400};">${awayName}</span>
                  </div>
                  ${m.isUser ? formatMatchEvents(m.events, homeIsUser) : ""}
                </div>`;
              }).join("")}
            </div>`;
          } else if (lastUclResults.ties) {
            // 淘汰赛赛果
            const sortedTies = [...lastUclResults.ties].sort((a, b) => {
              const aUser = (a.teamAName === "我的球队" || a.teamBName === "我的球队") ? 1 : 0;
              const bUser = (b.teamAName === "我的球队" || b.teamBName === "我的球队") ? 1 : 0;
              return bUser - aUser;
            });
            resultsHtml = `<div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#60a5fa;">欧冠 ${lastUclResults.roundName} 赛果</div>
              ${sortedTies.map(tie => {
                const isUser = tie.teamAName === "我的球队" || tie.teamBName === "我的球队";
                const leg = lastUclResults.legNum === 1 ? tie.leg1 : tie.leg2;
                if (!leg) return "";
                const homeName = ucl.teams[leg.homeIdx].name;
                const awayName = ucl.teams[leg.awayIdx].name;
                const homeIsUser = ucl.teams[leg.homeIdx].isUser;
                const awayIsUser = ucl.teams[leg.awayIdx].isUser;
                // Leg2决定后：败者灰色，用户球队始终绿色
                const decided = lastUclResults.legNum === 2 && tie.winnerIdx !== null;
                let scoreColor = getMatchScoreColor(leg.isUser, leg.userResult);
                // Leg2用户比赛：比分颜色根据是否晋级决定，而非单场胜负
                if (lastUclResults.legNum === 2 && leg.isUser && decided) {
                  const userAdvances = (homeIsUser && tie.winnerIdx === tie.teamAIdx) || (awayIsUser && tie.winnerIdx === tie.teamBIdx);
                  scoreColor = userAdvances ? '#34d399' : '#f87171';
                }
                const homeWon = decided && tie.winnerIdx === tie.teamAIdx;
                const awayWon = decided && tie.winnerIdx === tie.teamBIdx;
                const homeColor = homeIsUser ? '#34d399' : decided ? (homeWon ? '#e2e8f0' : '#64748b') : '#e2e8f0';
                const awayColor = awayIsUser ? '#34d399' : decided ? (awayWon ? '#e2e8f0' : '#64748b') : '#e2e8f0';
                let aggText = "";
                if (lastUclResults.legNum === 2 && tie.aggA !== null) {
                  aggText = `<div style="font-size:11px; color:#94a3b8; text-align:center;">总比分 ${tie.aggA}-${tie.aggB}${tie.leg2 && tie.leg2.et ? ' (加时)' : ''}${tie.penaltyHome !== undefined ? ` (点${tie.penaltyHome}-${tie.penaltyAway})` : ''} ${tie.winnerIdx === tie.teamAIdx ? tie.teamAName : tie.teamBName}晋级</div>`;
                }
                return `<div style="margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                    <span style="text-align:right; flex:1; color:${homeColor}; font-weight:${homeIsUser ? 700 : 400};">${homeName}</span>
                    <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700;">${leg.homeGoals} - ${leg.awayGoals}${leg.et ? '<span style="font-size:11px;"> (加时)</span>' : ''}</span>
                    <span style="flex:1; color:${awayColor}; font-weight:${awayIsUser ? 700 : 400};">${awayName}</span>
                  </div>
                  ${leg.isUser ? formatMatchEvents(leg.events, homeIsUser) : ""}
                  ${aggText}
                </div>`;
              }).join("")}
            </div>`;
          } else if (lastUclResults.match) {
            // 决赛赛果
            const fm = lastUclResults.match;
            const homeIsUser = ucl.teams[fm.homeIdx].isUser;
            const awayIsUser = ucl.teams[fm.awayIdx].isUser;
            const scoreColor = fm.isUser ? (fm.userResult === "win" ? "#34d399" : "#f87171") : "#e2e8f0";
            let sc = `${fm.homeGoals} - ${fm.awayGoals}`;
            if (fm.et) sc += ' (加时)';
            if (fm.penaltyHome !== undefined) sc += ` (点${fm.penaltyHome}-${fm.penaltyAway})`;
            resultsHtml = `<div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#60a5fa;">欧冠决赛 赛果</div>
              <div style="margin-bottom:10px;">
                <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                  <span style="text-align:right; flex:1; color:${homeIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${homeIsUser ? 700 : 400};">${fm.homeName}</span>
                  <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700;">${sc}</span>
                  <span style="flex:1; color:${awayIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${awayIsUser ? 700 : 400};">${fm.awayName}</span>
                </div>
                ${fm.isUser ? formatMatchEvents(fm.events, homeIsUser) : ""}
              </div>
              <div style="text-align:center; color:#60a5fa; font-weight:700;">冠军：${ucl.champion}</div>
            </div>`;
          }
        } else if (lastSimType === "cup" && lastCupResults) {
          // 杯赛赛果展示
          resultsHtml = `
            <div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#facc15;">足总杯 ${lastCupResults.roundName} 赛果</div>
              ${[...lastCupResults.matches].sort((a, b) => (b.isUser ? 1 : 0) - (a.isUser ? 1 : 0)).map(m => {
                const homeIsUser = m.homeName === "我的球队";
                const awayIsUser = m.awayName === "我的球队";
                const homeWon = m.winnerIdx === m.homeIdx;
                const awayWon = m.winnerIdx === m.awayIdx;
                const scoreColor = getMatchScoreColor(m.isUser, m.userResult);
                const penaltyColor = !m.isUser ? "#94a3b8" : m.userResult === "win" ? "#34d399" : "#f87171";
                const scoreText = m.penaltyHome !== undefined
                  ? `${m.homeGoals} - ${m.awayGoals}<span style="font-size:11px; color:${penaltyColor};"> (点${m.penaltyHome}-${m.penaltyAway})</span>`
                  : `${m.homeGoals} - ${m.awayGoals}`;
                return `
                <div style="margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                    <span style="text-align:right; flex:1; color:${homeIsUser ? '#34d399' : homeWon ? '#e2e8f0' : '#64748b'}; font-weight:${homeIsUser ? 700 : 400};">${m.homeName}</span>
                    <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700; white-space:nowrap;">${scoreText}</span>
                    <span style="flex:1; color:${awayIsUser ? '#34d399' : awayWon ? '#e2e8f0' : '#64748b'}; font-weight:${awayIsUser ? 700 : 400};">${m.awayName}</span>
                  </div>
                  ${m.isUser ? formatMatchEvents(m.events, homeIsUser) : ""}
                </div>`;
              }).join("")}
            </div>`;
        } else if (lastSimType === "league" && lastRoundResults.length > 0) {
          resultsHtml = `
            <div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#34d399;">第 ${currentRound} 轮赛果</div>
              ${lastRoundResults.map(r => {
                const scoreColor = getMatchScoreColor(r.isUser, r.userResult);
                const userIsHome = r.homeName === "我的球队";
                return `
                <div style="margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                    <span style="text-align:right; flex:1; color:${r.isUser && userIsHome ? '#34d399' : '#e2e8f0'}; font-weight:${r.isUser && userIsHome ? 700 : 400};">${r.homeName}</span>
                    <span style="flex:0 0 auto; padding:0 10px; color:${scoreColor}; font-weight:700;">${r.homeGoals} - ${r.awayGoals}</span>
                    <span style="flex:1; color:${r.isUser && !userIsHome ? '#34d399' : '#e2e8f0'}; font-weight:${r.isUser && !userIsHome ? 700 : 400};">${r.awayName}</span>
                  </div>
                  ${r.isUser ? formatMatchEvents(r.events, userIsHome) : ""}
                </div>`;
              }).join("")}
            </div>`;
        }
        if (cupRoundPending && cup.rounds[cupRoundPending].matches.length > 0) {
          // 同时展示下一场杯赛对阵
          const pendingMatches = cup.rounds[cupRoundPending].matches;
          resultsHtml += `
            <div style="margin-bottom:16px;">
              <div style="margin-bottom:8px; font-weight:700; color:#facc15;">足总杯 ${CUP_ROUND_NAMES[cupRoundPending]} 对阵</div>
              ${pendingMatches.map(m => {
                const homeIsUser = m.homeName === "我的球队";
                const awayIsUser = m.awayName === "我的球队";
                return `
                <div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0;">
                  <span style="text-align:right; flex:1; color:${homeIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${homeIsUser ? 700 : 400};">${m.homeName}</span>
                  <span style="flex:0 0 auto; padding:0 10px; color:#64748b; font-weight:700; white-space:nowrap;">vs</span>
                  <span style="flex:1; color:${awayIsUser ? '#34d399' : '#e2e8f0'}; font-weight:${awayIsUser ? 700 : 400};">${m.awayName}</span>
                </div>`;
              }).join("")}
            </div>`;
        }
        const cupHtml = buildCupBracketHtml(cup);
        const uclStandingsHtml = buildUclStandingsHtml();
        const uclBracketHtml = buildUclBracketHtml(ucl);
        contentHtml = `
          <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
            <div style="flex:0 0 240px; margin:0 auto;">
              ${resultsHtml || '<div class="empty-state">尚无赛果</div>'}
            </div>
            <div style="flex:1; min-width:280px;">
              ${buildStandingsTableHtml(sorted)}
            </div>
          </div>
          ${buildPlayerStatsHtml(null, { showFilter: true })}
          ${uclStandingsHtml}
          ${cupHtml}
          ${uclBracketHtml}`;
      } else if (viewSeason === "cumulative") {
        contentHtml = `<div class="empty-state" style="text-align:left; padding:0;">累计统计涵盖所有已完成赛季的数据</div>` + buildPlayerStatsHtml(buildCumulativeStats(), { showAge: false, showFilter: true });
      } else {
        const hist = seasonHistory.find(s => s.seasonNum == viewSeason);
        if (hist) {
          const sorted = [...hist.standings].sort((a, b) =>
            b.points - a.points || b.gd - a.gd || b.gf - a.gf
          );
          const histCupHtml = hist.cup ? buildCupBracketHtml(hist.cup) : '';
          const histUclHtml = hist.ucl ? buildUclBracketHtml(hist.ucl) : '';
          contentHtml = `
            <div style="flex:1; min-width:280px;">
              ${buildStandingsTableHtml(sorted)}
            </div>
            ${buildPlayerStatsHtml(hist.stats, { showFilter: true })}
            ${histCupHtml}
            ${histUclHtml}`;
        } else {
          contentHtml = '<div class="empty-state">无数据</div>';
        }
      }

      candidateList.innerHTML = `<div>${seasonSelector}${contentHtml}</div>`;

      const seasonSelect = document.getElementById("seasonSelect");
      if (seasonSelect) {
        seasonSelect.addEventListener("change", (e) => {
          viewSeason = e.target.value;
          renderLeague();
        });
      }

      const playerStatsFilterSelect = document.getElementById("playerStatsFilterSelect");
      if (playerStatsFilterSelect) {
        playerStatsFilterSelect.addEventListener("change", (e) => {
          playerStatsFilter = e.target.value;
          renderLeague();
        });
      }
    }

    // 版本号（基于页面更新时间）
    (function() {
      const d = new Date(document.lastModified);
      const pad = n => String(n).padStart(2, '0');
      const ts = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      document.getElementById('versionFooter').textContent = `版本 ${ts}`;
    })();
  </script>
</body>
</html>
